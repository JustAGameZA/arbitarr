# M7-9: reference compose file for running Arbitarr as a container.
#
# Every value below is a placeholder (RFC 5737/2606 example addresses, "REDACTED" secrets) — copy
# this file and replace them with your real NZBHydra2 endpoint and API keys before use. Never
# commit real hosts or keys here (AC21/D2).
#
# arb-c29: the NZBHydra2 base URL below is a .invalid address on purpose — the seeder and the
# Sources admin endpoints both reject a .invalid host at seed/write time (SourceRepository.
# ValidateBaseUrl) rather than silently seeding an unreachable upstream, so leaving this placeholder
# in place on first run seeds nothing instead of a broken source. Replace it with your real
# NZBHydra2 endpoint.
#
# There is no admin-key environment variable, and there cannot be one (ADR 0004): the admin key has
# no env-var write path by design. Set it after the container is up, over the API — see the
# README's "Admin key setup" section (PUT /api/admin/security/admin-key).
services:
  arbitarr:
    build: .
    image: arbitarr:latest
    container_name: arbitarr
    ports:
      # Host 9705 per the deployment spec: 8080 is the most contended port on a typical
      # homelab host, so the container's internal 8080 is published on 9705 instead.
      - "9705:8080"
    volumes:
      # Runtime state: SQLite database, per-instance HMAC secret, fetched datasets (AC21).
      - ./config:/config
    environment:
      # Upstream NZBHydra2 instance Arbitarr queries. Replace with your real host/port.
      ARBITARR__SOURCES__NZBHYDRA__BASEURL: "http://nzbhydra2.example.invalid:5076"
      # NZBHydra2's own API key (distinct from Arbitarr's client/admin keys below).
      ARBITARR__SOURCES__NZBHYDRA__APIKEY: "REDACTED"
      # Inbound Torznab/Newznab client apikey(s) *arr apps authenticate to Arbitarr with (M1-9).
      # A single key is simplest; ARBITARR__CLIENTAPIKEYS__0__NAME / __KEY supports naming multiple.
      ARBITARR__APIKEY: "REDACTED"
    restart: unless-stopped
