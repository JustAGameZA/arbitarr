<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Arbitarr">
  <!--
    Colour literals here are intentional and permitted: AC3 forbids literals in
    *.module.css files (which can reference CSS custom properties from the
    document). This SVG is a standalone static asset with no access to the
    document's custom properties, so literals are the only option. See
    .omc/plans/issues/047-favicon.md Step 1.

    prefers-color-scheme is embedded directly in the SVG (supported in browser
    tab/favicon contexts) so the mark stays legible in both light and dark
    browser chrome without a second asset.
  -->
  <style>
    .ring { fill: #1f6feb; }
    .arrow { fill: #f5f7fa; }
    @media (prefers-color-scheme: light) {
      .ring { fill: #1a56c4; }
      .arrow { fill: #ffffff; }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="15" />
  <path class="arrow" d="M9 20 L16 9 L23 20 L18 20 L18 24 L14 24 L14 20 Z" />
</svg>
