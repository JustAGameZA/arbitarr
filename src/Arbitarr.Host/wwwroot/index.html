<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arbitarr</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Arbitarr</h1>
    <p class="subtitle">Read-only dashboard. LAN-only, no login required.</p>
  </header>

  <main>
    <section id="status-panel">
      <h2>Status</h2>
      <div class="panel-body" id="status-body">Loading…</div>
    </section>

    <section id="searches-panel">
      <h2>Recent Searches</h2>
      <div class="panel-body" id="searches-body">Loading…</div>
    </section>

    <section id="config-panel">
      <h2>Effective Configuration</h2>
      <div class="panel-body" id="config-body">Loading…</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
