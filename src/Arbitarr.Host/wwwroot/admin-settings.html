<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arbitarr — Settings</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Arbitarr — Settings</h1>
    <p class="subtitle">Admin-only. Requires the admin API key (D2). Bounds and rationale come from the server — out-of-bounds changes are rejected, never clamped (AC24).</p>
  </header>

  <main>
    <section id="admin-key-panel">
      <h2>Admin API Key</h2>
      <div class="panel-body">
        <label>
          Admin API Key
          <input type="password" id="admin-key" autocomplete="off" required />
        </label>
        <button type="button" id="load-settings">Load settings</button>
      </div>
    </section>

    <section id="settings-panel">
      <h2>Settings</h2>
      <div class="panel-body" id="settings-body"><p class="empty-text">Enter the admin key and load settings.</p></div>
    </section>
  </main>

  <script src="admin-settings.js"></script>
</body>
</html>
