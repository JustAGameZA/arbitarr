# E2E golden path (arb-rga.7): the image under test plus the stub Torznab upstream.
#
# This file is for the E2E lane only. The repository-root docker-compose.yml remains the
# reference deployment file; this one is deliberately separate so the operator-facing
# example is never contorted to serve a test.
#
# The image is not built here. `Deploy review environment` has already built and tagged
# arbitarr-review:ci by the time this runs, and rebuilding it would both waste the layer
# cache and, worse, allow the E2E to pass against an image that is not the one the rest of
# the job asserted on. IMAGE is overridable only so a developer can point at a local tag.

services:
  stub-upstream:
    build:
      context: ./stub-upstream
    environment:
      STUB_PORT: "5100"
      # LOAD-BEARING. Every <link> the stub emits carries this origin, and
      # NzbHydraSource's SSRF guard (TryValidateOriginPinnedLink) DROPS any item whose
      # link origin differs from the source's configured base URL -- silently, producing
      # zero search rows rather than an error. This value and the baseUrl the E2E creates
      # the source with must stay identical. Verified: with these mismatched, the real
      # parser returns 0 rows from fixtures that are otherwise perfectly well-formed.
      STUB_PUBLIC_ORIGIN: "http://stub-upstream:5100"
    # Not published to the host. Only arbitarr needs to reach it, over the compose network.
    expose:
      - "5100"
    networks:
      default:
        aliases:
          # A SECOND name for the same container, reachable and serving identical fixtures.
          # It exists so the E2E can configure a source whose base URL differs from the
          # origin the stub stamps into its <link> elements, while still being genuinely
          # reachable -- that is the only way to demonstrate the SSRF origin-pinning guard
          # dropping items for the RIGHT reason. An unreachable host would prove nothing:
          # zero rows from a connection failure looks identical to zero rows from the guard.
          - stub-upstream-alias
    healthcheck:
      # /ping is not a Torznab mode, so a healthy stub cannot be confused with a working
      # search path -- that is what the E2E itself is for.
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:5100/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

  arbitarr:
    image: ${IMAGE:-arbitarr-review:ci}
    depends_on:
      stub-upstream:
        condition: service_healthy
    ports:
      # Bound to loopback on purpose, and not only for hygiene: ADR 0004's bootstrap
      # bypass admits admin-mutating routes from loopback/RFC1918 while no admin key is
      # set, and that decision is made from the socket's own peer address. The E2E drives
      # the admin API through this published port precisely to land inside that window.
      - "127.0.0.1:8080:8080"
    environment:
      # No ARBITARR__SOURCES__NZBHYDRA__BASEURL here. The E2E creates the source through
      # POST /api/admin/sources instead, because "an operator can add a source and search
      # it" is the golden path under test -- seeding it from config would prove the search
      # pipeline while skipping the half most likely to regress.
      #
      # No admin key either: there is no env var for it and there cannot be one (ADR 0004).
      ARBITARR__LOGGING__LOGLEVEL__DEFAULT: "Information"
      # arb-fvd (ADR 0012): read from the runner/shell environment so golden-path.spec.ts's
      # passthrough-off positive control can flip this for one `docker compose up -d` cycle
      # and flip it back, without editing this file. Unset (the default in CI) means unset in
      # the container too -- Compose's ${VAR} substitution with no default drops the key
      # entirely rather than passing an empty string, and LanPassthroughOptions.FromEnvironment
      # treats "unset" the same as "on" (only a recognised false-y token turns it off). So the
      # normal run of this stack is unaffected; only a caller that exports
      # ARBITARR_LAN_PASSTHROUGH=false before `up -d` sees it here.
      ARBITARR_LAN_PASSTHROUGH: "${ARBITARR_LAN_PASSTHROUGH:-}"
    # NO healthcheck, deliberately. The runtime image is mcr.microsoft.com/dotnet/aspnet,
    # which ships neither wget nor curl, so an in-container HTTP probe cannot work without
    # adding a tool to the production image purely to serve a test -- which would change the
    # very artifact under test, and is the wrong trade.
    #
    # A first attempt used `wget` here and failed CI with "container e2e-arbitarr-1 is
    # unhealthy" while the application had in fact started perfectly ("Now listening on:
    # http://[::]:8080" in the logs). Readiness is therefore waited for from the RUNNER,
    # which has curl, in the workflow step that follows `compose up`.
    #
    # Consequence, stated rather than hidden: `depends_on` cannot gate on this service, so
    # nothing else here may declare a service_healthy dependency on arbitarr.
