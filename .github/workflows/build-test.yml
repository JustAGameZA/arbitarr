name: Build & test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    env:
      DOTNET_GCHeapHardLimit: "0x80000000"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Arbitarr.sln

      - name: Build (sequential)
        run: dotnet build Arbitarr.sln -c Release -m:1 --no-restore

      - name: Test
        run: dotnet test Arbitarr.sln -c Release --no-build --logger trx --results-directory ./TestResults

      - name: Enforce test-count floor
        shell: bash
        run: |
          set -euo pipefail

          floor_file="tests/test-count-floor.txt"
          if [ ! -f "$floor_file" ]; then
            echo "BLOCKED: $floor_file is missing." >&2
            exit 1
          fi
          floor=$(tr -d '[:space:]' < "$floor_file")

          total=0
          for trx in ./TestResults/*.trx; do
            [ -f "$trx" ] || continue
            # Each .trx's <ResultSummary><Counters .../> element carries both "total" (includes
            # skipped tests) and "executed" (tests that actually ran). Use "executed" so a
            # skipped test can't be counted toward the floor without actually running.
            count=$(grep -o 'executed="[0-9]*"' "$trx" | head -1 | grep -o '[0-9]*')
            count=${count:-0}
            total=$((total + count))
          done

          echo "Executed test count: $total (floor: $floor)"
          if [ "$total" -lt "$floor" ]; then
            echo "BLOCKED: executed test count ($total) is below the committed floor ($floor) in $floor_file." >&2
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Frontend (src/Arbitarr.Web). These steps sit AFTER the .NET test-count
      # floor and BEFORE the tree-wide secret/topology guard deliberately: the
      # backend floor above parses executed="N" out of .trx, the frontend floor
      # below parses numPassedTests out of the Vitest JSON report. Two files,
      # two parsers, so neither suite's count can mask a collapse in the other.
      # ----------------------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Arbitarr.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Arbitarr.Web
        # `npm ci` (not `npm install`) so the committed lockfile is authoritative
        # and CI fails on drift instead of silently resolving new versions.
        run: npm ci

      - name: Frontend typecheck
        working-directory: src/Arbitarr.Web
        run: npm run typecheck

      - name: Frontend lint
        working-directory: src/Arbitarr.Web
        run: npm run lint

      - name: Frontend chrome guards
        shell: bash
        working-directory: src/Arbitarr.Web
        run: |
          set -euo pipefail

          fail=0

          # See the tree-wide guard below for why a bare `|| true` is unsafe here:
          # it would mask a broken grep (exit >=2) as "no matches found".
          run_grep() {
            local out status
            out=$("$@") ; status=$?
            if [ "$status" -gt 1 ]; then
              echo "BLOCKED: guard command failed (exit $status): $*" >&2
              exit 1
            fi
            printf '%s' "$out"
          }

          # --- AC3: colour literals live ONLY in theme.css ---------------------
          # Component stylesheets must reference var(--token). A hard-coded hex,
          # rgb() or hsl() in a *.module.css is how the pinned palette gets
          # bypassed one component at a time until the shell no longer matches
          # *arr while every other gate stays green.
          colour_pattern='#[0-9a-fA-F]{3,8}\b|rgba?\(|hsla?\('
          hits=''
          while IFS= read -r f; do
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges' "$f")
            m=$(printf '%s' "$stripped" | grep -nE "$colour_pattern" || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f -name '*.module.css')
          if [ -n "$hits" ]; then
            echo "BLOCKED (AC3): colour literal in a component stylesheet. Use var(--token) from src/styles/theme.css:" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- Dark theme is not optional --------------------------------------
          # A light-mode block or a theme switch would let the shell render light
          # without AC-CHROME noticing: those assertions read :root, which a
          # media query or [data-theme] override can shadow at runtime.
          # Comments are stripped before scanning. theme.css documents the rule
          # ("no prefers-color-scheme: light block, no [data-theme] switch") and a
          # naive grep matches that prose and blocks on its own documentation. The
          # cure is to scan declarations rather than to weaken the pattern -- a
          # looser pattern would let a real light-mode block through, which is the
          # entire failure this guard exists to prevent.
          theme_pattern='prefers-color-scheme[[:space:]]*:[[:space:]]*light|\[data-theme'
          hits=''
          while IFS= read -r f; do
            # Strip /* ... */ (including multi-line) and // comments, keeping line
            # numbering intact so the report still points at a real line.
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges; s{//.*$}{}gm' "$f")
            m=$(printf '%s' "$stripped" | grep -nE "$theme_pattern" || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f \( -name '*.css' -o -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$hits" ]; then
            echo "BLOCKED: light-theme block or theme switch found. The shell is dark-only:" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- The admin key is session-only ------------------------------------
          # It must live in the Zustand store and nowhere persistent. Web storage
          # survives tab close and is readable by any script on the origin.
          #
          # Comments are stripped first, for the same reason as the theme guard
          # above: adminKeyStore.ts documents the rule in prose ("not written to
          # localStorage, not to sessionStorage") and an unstripped grep blocks
          # on its own documentation.
          #
          # *.test.ts(x) is excluded. The guard's subject is production code that
          # WRITES the key to storage; adminKeyStore.test.ts asserts both stores
          # are EMPTY after a key is set, which is the negation of a violation and
          # cannot be written without naming them. Excluding tests loses nothing:
          # a test file ships no runtime behaviour, and a persist middleware added
          # to the store would still be caught in the source it is added to -- and
          # caught a second time by that very assertion.
          hits=''
          while IFS= read -r f; do
            case "$f" in *.test.ts|*.test.tsx) continue ;; esac
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges; s{//.*$}{}gm' "$f")
            m=$(printf '%s' "$stripped" | grep -nE 'localStorage|sessionStorage' || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f \( -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$hits" ]; then
            echo "BLOCKED: web storage referenced in src/. The admin key is session-only (Zustand):" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- theme.css must actually define the palette ------------------------
          # Guards the guards: if theme.css were emptied or renamed, every AC-CHROME
          # read would throw on an empty token and the failure would look like a
          # broken harness rather than a deleted palette.
          for token in --bg-app --bg-sidebar --bg-panel --border --fg-primary --accent; do
            if ! grep -qE "^[[:space:]]*${token}:" src/styles/theme.css; then
              echo "BLOCKED: ${token} is not defined in src/styles/theme.css." >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Frontend chrome guards passed."

      - name: Frontend tests
        working-directory: src/Arbitarr.Web
        run: npm test

      - name: Enforce frontend test-count floor
        shell: bash
        working-directory: src/Arbitarr.Web
        run: |
          set -euo pipefail

          floor_file="../../tests/frontend-test-count-floor.txt"
          if [ ! -f "$floor_file" ]; then
            echo "BLOCKED: $floor_file is missing." >&2
            exit 1
          fi
          floor=$(tr -d '[:space:]' < "$floor_file")

          report="vitest-report.json"
          if [ ! -f "$report" ]; then
            echo "BLOCKED: $report is missing -- the test step must emit the JSON reporter." >&2
            exit 1
          fi

          # numPassedTests, not numTotalTests: a skipped or todo test must not be
          # able to hold the floor up without actually running. node is already on
          # PATH from the Setup Node step, so parse with it rather than with a
          # regex over JSON.
          total=$(node -p "require('./${report}').numPassedTests")
          if [ -z "$total" ] || [ "$total" = "undefined" ]; then
            echo "BLOCKED: could not read numPassedTests from $report." >&2
            exit 1
          fi

          echo "Frontend passed test count: $total (floor: $floor)"
          if [ "$total" -lt "$floor" ]; then
            echo "BLOCKED: frontend passed test count ($total) is below the committed floor ($floor) in tests/frontend-test-count-floor.txt." >&2
            exit 1
          fi

      - name: Tree-wide secret/topology guard
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          # grep/git-grep exit codes: 0 = match found, 1 = no match (expected, not an error),
          # >=2 = a real error (bad pattern, I/O failure, etc.). A bare `|| true` after these
          # calls would mask exit >=2 the same as exit 1, silently turning a broken guard into
          # a no-op pass. run_grep captures output AND the exit code, and only tolerates 0/1.
          run_grep() {
            local out status
            out=$("$@") ; status=$?
            if [ "$status" -gt 1 ]; then
              echo "BLOCKED: guard command failed (exit $status): $*" >&2
              exit 1
            fi
            printf '%s' "$out"
          }

          # 1. Private/LAN IP ranges (RFC 1918) anywhere in the tracked tree. Built up from
          # octet ranges (not a literal private dotted-quad) so this guard does not trip on
          # its own source. Mirrors .git/hooks/pre-commit's pattern. Anchored on
          # (^|[^0-9.]) / ([^0-9.]|$) rather than \b so a real dotted-quad can't hide by
          # extending the run of digits/dots past a \b word boundary.
          oct2="[0-9]{1,3}"
          p1="192\.168\.${oct2}\.${oct2}"
          p2="10\.${oct2}\.${oct2}\.${oct2}"
          p3="172\.(1[6-9]|2[0-9]|3[01])\.${oct2}\.${oct2}"
          ip_pattern="(^|[^0-9.])(${p1}|${p2}|${p3})([^0-9.]|\$)"

          hits=$(run_grep git grep -aInE "$ip_pattern" -- . ':(exclude)tests/test-count-floor.txt')
          if [ -n "$hits" ]; then
            echo "BLOCKED: private LAN IP address found in tracked tree (use 192.0.2.x documentation range instead):" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 2. Credential-looking patterns. The allowlist is checked against the matched VALUE
          # only (not the whole line), so a real secret can't hide behind an unrelated allowlist
          # word elsewhere on the same line (e.g. a trailing "# example" comment).
          cred_pattern='(^|[^A-Za-z0-9])((apikey|api_key|password|passwd|secret|token)["'"'"' ]*[=:]["'"'"' ]*|bearer +)([A-Za-z0-9+/_-]{16,})'
          allowlist='^(REDACTED|secret-api-key|placeholder|example|your-|xxxx)'

          hits=$(run_grep git grep -anE "$cred_pattern" -- . | while IFS=: read -r file line rest; do
            value=$(printf '%s\n' "$rest" | grep -oE "$cred_pattern" | tail -1 | grep -oE '[A-Za-z0-9+/_-]{16,}$' || true)
            if [ -n "$value" ] && ! printf '%s\n' "$value" | grep -qiE "$allowlist"; then
              printf '%s:%s:%s\n' "$file" "$line" "$rest"
            fi
          done)
          if [ -n "$hits" ]; then
            echo "BLOCKED: credential-looking value found in tracked tree:" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 2b. Keyword-less, high-signal secret shapes (AWS access key, GitHub PAT, JWT, PEM
          # private key header). Built from split literals so this guard's own source never
          # matches its own detection patterns.
          akia_pat="AKIA[0-9A-Z]{16}"
          ghp_pat="ghp_[A-Za-z0-9]{36}"
          jwt_pat="eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"
          pem_pat="-----BEGIN"' [A-Z ]*'"PRIVATE KEY-----"
          shape_pattern="${akia_pat}|${ghp_pat}|${jwt_pat}|${pem_pat}"

          hits=$(run_grep git grep -aInE "$shape_pattern" -- .)
          if [ -n "$hits" ]; then
            echo "BLOCKED: high-signal secret shape (AWS/GitHub/JWT/PEM) found in tracked tree:" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 3. Files that should never be committed at all.
          sensitive_files=$(git ls-files -- '*.env' '*.pfx' '*.p12' '*.key' '*.pem' '*.snk' '*secrets.json' '*appsettings.Local.json')
          if [ -n "$sensitive_files" ]; then
            echo "BLOCKED: sensitive file present in tracked tree:" >&2
            echo "$sensitive_files" >&2
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "Tree-wide guard failed. This re-runs the .git/hooks/pre-commit checks over the" >&2
            echo "whole tree so the guarantee does not depend on contributors configuring hooks." >&2
            exit 1
          fi

          echo "Tree-wide secret/topology guard passed."
