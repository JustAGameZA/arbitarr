name: Build & test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      measure-filter:
        description: >-
          Measure the filtered suite and PRINT the counts without writing the
          test-counts artifact. This is how a new value for the bootstrap
          constants is obtained: run it on master, read the printed number, and
          set the constant from that number in a follow-up PR. Never compute a
          bootstrap constant by arithmetic on the old one.
        type: boolean
        default: false
      simulate_test_failure:
        description: >-
          Force the test step to fail so the failure()-gated failed-attempt
          artifact upload steps can be exercised on demand.
        type: boolean
        default: false

# The category filter, written ONCE at workflow level and reused by every matrix
# job, by the measure-filter report and by the recorded artifact. Keeping it in
# one variable is what makes "the PR lane and the master lane run an identical
# filter" true by construction rather than by strings being kept in step -- and
# it is what stops the artifact ever recording a filter the run did not use.
# Splitting the single test step into a matrix made this MORE load-bearing, not
# less: four jobs now read it, and a per-job copy would let one group drift.
# Timing/Load/Quarantine are excluded here and run unfiltered nightly
# (arb-rga.8); see docs/adr/0011 and docs/standards/process.md.
#
# TEST_ASSEMBLIES is the single, hoisted definition of the eleven test assembly
# names (arb-6ke). Three places used to carry their own copy of this list --
# the prep-job "Assert the build output was restored" step, the gate's trx
# count, and (implicitly) the matrix groups -- and a misspelling in one could
# drift from the other two without any check ever catching it. Now the prep
# assertion and the gate's set assertion both read this one variable, so they
# cannot drift apart; the matrix groups (~163-169) still list assemblies
# literally because a workflow matrix cannot expand a variable into separate
# `include` entries, which is exactly why arb-bj7 adds a guards step that
# unions the matrix groups and diffs them against this list instead. Sorted
# and space-separated; consumers split on whitespace.
#
# BuiltAssemblies.TestAssemblyNames (tests/Arbitarr.Architecture.Tests/BuiltAssemblies.cs)
# is a DELIBERATELY INDEPENDENT C# counterpart to this token, not a copy of it --
# see that class's remarks for why the two are kept apart. The guards job's
# "Verify BuiltAssemblies.TestAssemblyNames matches TEST_ASSEMBLIES" step (arb-hbt)
# is what diffs them and catches drift between the two.
#
# SHARD_ASSEMBLIES (arb-adm) names the assemblies that are allowed to run split
# across several matrix entries, and how many shards each takes, as
# `<Assembly>:<N>` tokens. It is an ALLOW-LIST, not a description: the guards
# job rejects a `shard:` on any assembly this token does not name, and rejects
# an assembly named here whose matrix entries do not carry exactly the shards
# 1of<N>..<N>of<N>. Sharding an assembly therefore takes two deliberate edits
# (this token and the matrix), and neither alone silently changes what runs.
#
# Integration is sharded because it is the long pole: it ran ~2m04s alone while
# the other two groups took 45s and 32s, so rebalancing WHOLE assemblies could
# not bring the gate under three minutes -- only splitting the one assembly can.
env:
  TEST_FILTER: "Category!=Timing&Category!=Load&Category!=Quarantine"
  SHARD_ASSEMBLIES: "Arbitarr.Integration.Tests:2"
  TEST_ASSEMBLIES: "Arbitarr.Ai.Tests Arbitarr.Api.Tests Arbitarr.Architecture.Tests Arbitarr.Core.Identity.Tests Arbitarr.Core.Tests Arbitarr.Data.Tests Arbitarr.Host.Tests Arbitarr.Integration.Tests Arbitarr.Media.Tests Arbitarr.Sources.Newznab.Tests Arbitarr.Sources.NzbHydra.Tests"

jobs:
  # --------------------------------------------------------------------------
  # prep: restore + build the whole solution ONCE, and publish the test output
  # for the matrix to consume.
  #
  # Building the solution here rather than per matrix group is not an
  # optimisation, it is a correctness requirement. The Mono.Cecil IL scan in
  # Arbitarr.Architecture.Tests (TestProcessGlobalStateTests) reads SIBLING
  # build output: it walks from its own output directory to
  # tests/*/bin/<config>/<tfm>/*.dll and needs all ELEVEN test assemblies present
  # in the SAME configuration and TFM (Ai, Api, Architecture, Core.Identity,
  # Core, Data, Host, Integration, Media, Sources.Newznab, Sources.NzbHydra). A
  # group that built only its own projects would leave the others missing and
  # the scan fails
  # LOUDLY naming them -- deliberately, so a missing assembly can never pass
  # vacuously over an empty set (CLAUDE.md section 4). See arb-rga.3 / PR #147.
  #
  # Since #157 (arb-n21) the same requirement extends to src/. Two further
  # Architecture scans read PRODUCTION output through the same walk, calling
  # ResolveAssemblyPath("src", ...) instead of ("tests", ...):
  #   ProductionProcessGlobalStateTests reads all NINE production assemblies
  #     (Ai, Api, Core, Core.Identity, Data, Host, Media, Sources.Newznab,
  #     Sources.NzbHydra);
  #   NoInlineDatabaseConnectionStringsTests reads Arbitarr.Data.
  # They fail identically -- "Could not locate the built assembly for ..." --
  # so the artifact must carry src/ output BESIDE tests/, not tests/ alone.
  # src/Arbitarr.Web is the React frontend: no csproj, no managed output, which
  # is why the production list is nine and not ten.
  # --------------------------------------------------------------------------
  prep:
    name: Build (prep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # There is no Directory.Packages.props in this repository (package
      # versions are declared per-csproj, not centrally managed), so the key
      # hashes the csproj files and any *.props that exist rather than naming a
      # central manifest that is not there. If central package management is
      # adopted later, Directory.Packages.props is matched by **/*.props already.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Arbitarr.sln

      # -m:1 stays. It is a memory bound, not a speed choice: parallel project
      # builds on a 2-core runner drove the compiler into swap. See
      # CONTRIBUTING.md's Build & test description.
      - name: Build (sequential)
        run: dotnet build Arbitarr.sln -c Release -m:1 --no-restore

      # Both roots are uploaded. src/ is not a convenience: the two Architecture
      # scans added by #157 resolve src/<Assembly>/bin/Release/net10.0/ by
      # walking up from their own output directory, so src/ must exist at the
      # same relative depth as tests/ or those scans fail loudly.
      #
      # Adding the second root MOVES THE ARCHIVE ROOT. upload-artifact v4 roots
      # the archive at the least common ancestor of everything it uploads: with
      # `tests/*/...` alone that was `tests/`, but `tests/*/...` plus `src/*/...`
      # share only the workspace root, so entries are now `tests/X/bin/...` and
      # `src/Y/bin/...` with the prefix intact. Every consumer's download `path:`
      # changed from `tests` to `.` to match -- unpacking into `tests` now would
      # produce `tests/tests/X/...` and `tests/src/Y/...`, and both scans plus
      # the per-dll assertions would fail on paths that look almost right.
      - name: Upload build output
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: test-build
          path: |
            tests/*/bin/Release/net10.0/**
            src/*/bin/Release/net10.0/**
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # backend: four runners, one per assembly group, all consuming prep's build
  # output. Assemblies WITHIN a group run sequentially (a loop), so the group is
  # the unit of parallelism and nothing new races inside a job.
  #
  # Groups A1 and A2 are the two shards of Integration: it is by far the longest
  # assembly and it is the only one holding several live ASP.NET hosts at once
  # (arb-rga.4 sets maxParallelThreads 4 there). Splitting it -- rather than
  # moving whole assemblies between groups -- is what brings the gate under
  # three minutes, because Integration alone exceeded the budget of the other
  # two groups combined (arb-adm).
  # Group C carries Architecture, which is why every group restores the FULL
  # test output rather than only its own -- see the prep job's comment.
  # --------------------------------------------------------------------------
  backend:
    name: Backend (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: prep
    env:
      # 2 GB, uniform across all four groups. arb-rga.6's third comment asked
      # this bead to DECIDE this number from a measurement rather than inherit
      # it, and the sampler in the test step below is what produced the answer.
      #
      # Measured peak RSS of the whole dotnet/testhost tree (see the PR body for
      # the per-assembly table):
      #   group A  Integration      1.21 GiB  -- at maxParallelThreads 4,
      #                                    measured UNSHARDED; each of A1/A2 now
      #                                    runs half the classes, so this is an
      #                                    upper bound for either shard
      #   group B  max (Core)       0.42 GiB
      #   group C  max (Media)      0.31 GiB
      #
      # Integration is the only group holding several live ASP.NET hosts, and it
      # still sits at ~60% of this cap. The caveat that keeps that honest: the
      # measurement is tree RSS (runtime, native allocations and mapped files
      # included) while this variable caps only the managed GC heap, so actual
      # heap use is strictly below 1.21 GiB and the real headroom is larger than
      # the ratio suggests.
      #
      # Uncapped was considered and rejected: it makes the runner's own memory
      # the only bound, so a future leak in an Integration fixture grows until
      # the runner is OOM-killed -- an opaque failure -- instead of hitting a
      # limit that names itself.
      DOTNET_GCHeapHardLimit: "0x80000000"
    strategy:
      # A red group must not cancel the others: the gate sums executed= across
      # every group's trx, and a cancelled sibling would report a shrunken count
      # on top of the real failure, making the floor look breached when it was
      # never measured at all.
      fail-fast: false
      matrix:
        include:
          # A1/A2 are the two shards of Arbitarr.Integration.Tests (arb-adm).
          # ONE assembly token per entry is deliberate: the guards job's union
          # check reads `assemblies: "..."` lines and requires one such line per
          # `- group:` entry, so a shard must be a separate entry naming the same
          # single token, never a second token on one line. The `shard:` value is
          # what makes the repeat legal there -- see SHARD_ASSEMBLIES above and
          # the guard's shard rules. Renaming these groups is safe for branch
          # protection: only the gate job `Build & test` and `Deploy review
          # environment` are required checks, never the matrix job names.
          - group: A1
            assemblies: "Arbitarr.Integration.Tests"
            shard: "1of2"
          - group: A2
            assemblies: "Arbitarr.Integration.Tests"
            shard: "2of2"
          - group: B
            assemblies: "Arbitarr.Data.Tests Arbitarr.Api.Tests Arbitarr.Core.Tests"
          - group: C
            assemblies: "Arbitarr.Host.Tests Arbitarr.Media.Tests Arbitarr.Ai.Tests Arbitarr.Core.Identity.Tests Arbitarr.Sources.Newznab.Tests Arbitarr.Sources.NzbHydra.Tests Arbitarr.Architecture.Tests"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # upload-artifact v4 roots the archive at the least common ancestor of the
      # uploaded paths. prep uploads TWO roots -- `tests/*/bin/...` and
      # `src/*/bin/...` -- whose only common ancestor is the workspace root, so
      # the archive holds `tests/Arbitarr.Api.Tests/bin/...` and
      # `src/Arbitarr.Data/bin/...` with both prefixes intact, and it unpacks at
      # `.` rather than into `tests/`.
      #
      # That `.` is load-bearing, not tidiness. Both the tests/ walk and the
      # src/ walk in the Architecture scans are RELATIVE to the repository root
      # (five parents up from an assembly's own output directory), so the two
      # trees must sit beside each other exactly as they do in the checkout.
      # Unpacking into `tests/` would nest them one level deeper and every scan
      # would report "Could not locate the built assembly".
      #
      # download-artifact v7+ runs on node24 and needs runner >= 2.327.1. Every job
      # here is `runs-on: ubuntu-latest` (GitHub-hosted), which satisfies that; it
      # is called out because moving any of these jobs to a self-hosted runner
      # would break the download rather than the thing that was changed.
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-build
          path: .

      # The Cecil scans fail loudly on a missing sibling, but they only run in
      # group C. A truncated artifact would otherwise let A and B run a smaller
      # set of tests and report a smaller executed= sum, which the gate reads as
      # a floor breach in the wrong place -- or, if the floor happened to be low
      # enough, as a pass. Assert the precondition in every group, where the
      # failure names the actual cause instead of a count.
      #
      # BOTH roots are asserted. tests/ feeds TestProcessGlobalStateTests; src/
      # feeds ProductionProcessGlobalStateTests (all nine production
      # assemblies) and NoInlineDatabaseConnectionStringsTests (Arbitarr.Data),
      # added by #157. Those two are why src/ is in the artifact at all, so a
      # src/ path missing here is the exact failure this step exists to name.
      # src/Arbitarr.Web is absent from the list on purpose: it is the React
      # frontend, has no csproj, and produces no managed output to resolve.
      - name: Assert the build output was restored
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          # TEST_ASSEMBLIES is the single hoisted list (arb-6ke); this loop no
          # longer carries its own copy of the names.
          for a in $TEST_ASSEMBLIES; do
            dll="tests/${a}/bin/Release/net10.0/${a}.dll"
            if [ ! -f "$dll" ]; then
              echo "BLOCKED: missing test assembly ${dll} from the test-build artifact." >&2
              missing=1
            fi
          done

          for a in Arbitarr.Ai Arbitarr.Api Arbitarr.Core Arbitarr.Core.Identity \
                   Arbitarr.Data Arbitarr.Host Arbitarr.Media \
                   Arbitarr.Sources.Newznab Arbitarr.Sources.NzbHydra; do
            dll="src/${a}/bin/Release/net10.0/${a}.dll"
            if [ ! -f "$dll" ]; then
              echo "BLOCKED: missing production assembly ${dll} from the test-build artifact." >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "" >&2
            echo "All eleven test assemblies AND all nine production assemblies must be present" >&2
            echo "in the same configuration and TFM. Four Architecture scans resolve them by" >&2
            echo "walking from their own output directory to a sibling tree, and fail rather" >&2
            echo "than passing vacuously over a smaller set:" >&2
            echo "  TestProcessGlobalStateTests               reads tests/*/bin/Release/net10.0/" >&2
            echo "  QuarantineTraitTests                      reads tests/*/bin/Release/net10.0/  (arb-2nm)" >&2
            echo "  ProductionProcessGlobalStateTests         reads src/*/bin/Release/net10.0/  (#157)" >&2
            echo "  NoInlineDatabaseConnectionStringsTests    reads src/Arbitarr.Data/...       (#157)" >&2
            exit 1
          fi

          echo "All eleven test assemblies present under tests/*/bin/Release/net10.0/."
          echo "All nine production assemblies present under src/*/bin/Release/net10.0/."

      # The built dll is run DIRECTLY, not via the csproj. `dotnet test <csproj>
      # --no-build` still evaluates the project and needs obj/project.assets.json,
      # which the artifact does not carry (only bin/ is uploaded). Verified
      # locally that dll mode reports counts identical to csproj mode under this
      # filter: Data 218, Api 181, Core 384 -- the same numbers #154 measured.
      - name: Test (group ${{ matrix.group }})
        shell: bash
        env:
          GROUP_ASSEMBLIES: ${{ matrix.assemblies }}
          GROUP_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          # DOTNET_GCHeapHardLimit is set once at job level and applies to every
          # group; see the comment on it for the measurement behind the number.
          echo "DOTNET_GCHeapHardLimit: $DOTNET_GCHeapHardLimit"

          mkdir -p ./TestResults

          # Peak memory is sampled, not taken from `/usr/bin/time -v`. time -v
          # reports the max RSS of the process it waits for (plus children it has
          # already reaped), and `dotnet test` runs the tests in a SEPARATE
          # testhost process -- so time -v reports the driver and misses the
          # thing under measurement entirely. The first run of this workflow
          # showed exactly that: Integration, which holds up to four live ASP.NET
          # hosts, reported a LOWER peak (110 MB) than Core/Api (222 MB), which
          # hold none. A number that ranks the groups backwards cannot be used to
          # decide a heap cap, which is what arb-rga.6's third comment asks for.
          #
          # Instead sample the whole process tree's RSS while the run is in
          # flight and keep the maximum. 1 s is fine: the question is whether the
          # group approaches a 2 GB cap, not the exact byte.
          # The sampler must never be able to fail the job: it is instrumentation,
          # and a measurement that can red a green suite is worse than no
          # measurement. Every part that can fail is neutralised -- `|| echo 0`
          # on the sample, `|| status=$?` on the wait -- so the only thing
          # deciding this step's exit code is dotnet test itself.
          sample_peak() {
            out="$1" ; shift
            peak=0
            "$@" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              # Sum RSS across the whole dotnet/testhost tree: the driver, the
              # testhost the tests actually run in, and any host they spawn.
              # awk always prints exactly one number (`s+0`), so `cur` is a single
              # integer whenever ps worked. If ps is unavailable the pipeline
              # yields nothing and `cur` is empty -- hence the numeric test below
              # rather than `${cur:-0}`, which on a two-line value would feed
              # `[ ... -gt ... ]` something it reports as "integer expected".
              cur=$(ps -eo rss,comm --no-headers 2>/dev/null \
                    | awk '$2 ~ /^(dotnet|testhost)/ {s+=$1} END {print s+0}') || cur=''
              # An explicit if, not `[ ... ] && peak=...`: under set -e a
              # trailing false test would take the shell down with it.
              if printf '%s' "$cur" | grep -qE '^[0-9]+$' && [ "$cur" -gt "$peak" ]; then
                peak="$cur"
              fi
              sleep 1
            done
            # `wait` returns the child's status, which is the one that matters:
            # `$?` at this point belongs to the loop above, not to dotnet test.
            # Capture it directly off `wait` so nothing can run in between --
            # what would lose it is a BARE `local`/declaration executing between
            # the command and the read, since that resets `$?` to its own exit
            # code. (An assignment like `local status=$?` is NOT the broken
            # shape; the two run_grep helpers below declare with a bare `local`
            # FIRST and only then run the command, which is equally safe.) Kept
            # as plain globals here so the question does not arise.
            status=0
            wait "$pid" || status=$?
            echo "${peak:-0}" > "$out"
            return "$status"
          }

          # The sharding logic (arb-adm/arb-u9i) lives in a sourced script so the
          # positive controls in .github/scripts/test-count-gate-controls.sh run the
          # SAME text CI runs -- see docs/standards/process.md. Sourcing, not
          # executing: shard_filter reads $TEST_FILTER from this step's environment
          # and its stdout is the filter this step then uses.
          . ./.github/scripts/shard-filter.sh

          for a in $GROUP_ASSEMBLIES; do
            dll="tests/${a}/bin/Release/net10.0/${a}.dll"

            # The trx basename and the filter both depend on whether this entry
            # is a shard. The gate expects `<Assembly>.shard<k>of<N>` for a
            # sharded assembly and a bare `<Assembly>` otherwise, each exactly
            # once -- so this name is as load-bearing as the LogFileName comment
            # below explains the unsharded one is.
            run_filter="$TEST_FILTER"
            trx_name="$a"
            if [ -n "${GROUP_SHARD:-}" ]; then
              shard_k=${GROUP_SHARD%%of*}
              shard_n=${GROUP_SHARD##*of}
              trx_name="${a}.shard${GROUP_SHARD}"
              run_filter=$(shard_filter "$dll" "$shard_k" "$shard_n" "$a")
              echo "shard ${GROUP_SHARD} of ${a}: filter length ${#run_filter}"
            fi

            echo "::group::${trx_name}"
            start=$(date +%s)
            # LogFileName is NOT cosmetic. The default trx name is
            # <vm-hostname>_<yyyy-MM-dd_HH_mm_ss>.trx, which carries no assembly
            # name, so two assemblies finishing in the same second on two runners
            # that happen to share a VM hostname produce the SAME basename. The
            # gate then loses one file and reports a short count as a floor
            # breach. That is not hypothetical: run 3 of this PR summed 1311
            # instead of 1492 because Api (181) and Core.Identity (34) both wrote
            # the same default name. Naming the file after the assembly makes the
            # basename unique by construction, independent of runner or timing.
            # arb-e2x: the console output is teed to a file so a FAILED attempt
            # can keep it (see the failed-attempt upload below).
            #
            # The redirection is attached to the COMMAND sample_peak backgrounds,
            # not wrapped around the sample_peak call. sample_peak's whole
            # contract is that `wait "$pid"` returns dotnet test's own status
            # (see its comment above), and that contract is easiest to keep by
            # not putting anything between the caller and it. `set -o pipefail`
            # at the top of this step means a plain pipe would also propagate a
            # failing test -- both shapes were checked -- so this is the
            # conservative choice rather than the only correct one.
            #
            # stderr is folded into stdout so an assertion message cannot land
            # in a different file from the test that produced it.
            sample_peak "./TestResults/${trx_name}.peakkb" \
              dotnet test "$dll" \
                --filter "$run_filter" \
                --logger "trx;LogFileName=${trx_name}.trx" --results-directory ./TestResults \
                > >(tee "./TestResults/${trx_name}.console.log") 2>&1
            echo "$(( $(date +%s) - start ))" > "./TestResults/${trx_name}.secs"
            echo "peak dotnet+testhost RSS: $(cat "./TestResults/${trx_name}.peakkb") KB in $(cat "./TestResults/${trx_name}.secs") s"
            echo "::endgroup::"
          done

      # arb-5fs: dispatch-only switch to prove the failure()-gated upload below
      # actually fires, without committing a failing test. The event_name half
      # of the guard makes it impossible for this to run on push or
      # pull_request -- those events never set `inputs.simulate_test_failure`
      # (it does not exist on their payload), but the explicit event_name
      # check makes that impossibility structural rather than incidental.
      - name: Simulate test failure (group ${{ matrix.group }})
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_test_failure }}
        shell: bash
        run: exit 1

      - name: Report peak memory (group ${{ matrix.group }})
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Backend group ${{ matrix.group }} peak memory"
            echo ""
            echo "| Assembly | Peak dotnet+testhost RSS (KB) | Wall clock |"
            echo "|---|---|---|"
            for f in ./TestResults/*.peakkb; do
              [ -f "$f" ] || continue
              a=$(basename "$f" .peakkb)
              rss=$(cat "$f" 2>/dev/null || echo '?')
              secs=$(cat "./TestResults/${a}.secs" 2>/dev/null || echo '?')
              echo "| $a | $rss | ${secs}s |"
            done
            echo ""
            echo "Heap cap (all groups): $DOTNET_GCHeapHardLimit"
          } >> "$GITHUB_STEP_SUMMARY"

      # Each group's trx go up under their own name; the gate downloads trx-*
      # and sums executed= across all of them exactly as the single job did.
      - name: Upload test results (group ${{ matrix.group }})
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: trx-${{ matrix.group }}
          # The .shard<k>of<N>.listed file rides with the trx (arb-adm): the
          # gate needs the --list-tests class list and test count recorded by the
          # shard that produced it, and a separate artifact could go missing
          # without the trx-set check noticing. `if-no-files-found: error` still bites because every entry
          # produces at least one trx.
          path: |
            ./TestResults/*.trx
            ./TestResults/*.listed
          if-no-files-found: error
          retention-days: 1

      # arb-e2x: keep a FAILED attempt's evidence, which the trx-* artifact above
      # cannot. Two separate mechanisms destroyed the evidence for arb-agh:
      #
      #   1. A rerun of failed jobs OVERWRITES the job log. The stack trace only
      #      ever lived in that log -- the trx records which test failed, not the
      #      console output around it -- so `gh run view --log-failed` on both
      #      arb-agh runs now returns 0 bytes. The .console.log teed in the test
      #      step above is what puts that output in an artifact instead.
      #   2. `retention-days: 1` above. Measured on run 34554979831: attempt 1's
      #      trx-A1 (the failing attempt) and attempt 2's trx-A1 BOTH exist as
      #      separate artifacts, so the rerun did NOT overwrite the trx -- but
      #      both expired a day later. 14 days here outlives a weekend, which is
      #      how long a P0 flake actually takes to get looked at.
      #
      # That measurement is also why no `overwrite:` input is needed on either
      # step: a rerun gets its own artifact namespace, so the same name across
      # attempts does not 409.
      #
      # The name MUST NOT match `trx-*`: the gate downloads `pattern: trx-*` and
      # sums `executed=` across whatever it finds, so a per-attempt copy under a
      # matching name would be counted a second time and read as a floor breach.
      # `${{ github.run_attempt }}` keeps each attempt's copy distinct.
      - name: Upload failed attempt evidence (group ${{ matrix.group }})
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: failed-attempt-${{ github.run_attempt }}-${{ matrix.group }}
          path: |
            ./TestResults/*.trx
            ./TestResults/*.listed
            ./TestResults/*.secs
            ./TestResults/*.peakkb
            ./TestResults/*.console.log
          # warn, not error: this step runs on ANY failure in the job, including
          # one that happens before the test step writes anything (a restore or
          # a shard-filter failure). Erroring there would replace the real
          # failure in the log with a missing-artifact error.
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------------------
  # frontend: runs in parallel with prep and the backend matrix. It has no .NET
  # dependency at all, so making it wait on the build was pure serialisation --
  # it was only ever downstream because everything lived in one job.
  #
  # The floor is ENFORCED in the gate, not here. The floor value is resolved
  # from master's test-counts artifact, which needs `actions: read`; keeping
  # both enforcements in the one job that holds that permission avoids widening
  # this job's token, and keeps "both floors ratchet from the SAME master run"
  # true by construction rather than by two jobs independently resolving what
  # they hope is the same run id. The count reaches the gate as a job output.
  # --------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.count.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Arbitarr.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Arbitarr.Web
        # `npm ci` (not `npm install`) so the committed lockfile is authoritative
        # and CI fails on drift instead of silently resolving new versions.
        run: npm ci

      - name: Frontend typecheck
        working-directory: src/Arbitarr.Web
        run: npm run typecheck

      - name: Frontend lint
        working-directory: src/Arbitarr.Web
        run: npm run lint

      - name: Frontend chrome guards
        shell: bash
        working-directory: src/Arbitarr.Web
        run: |
          set -euo pipefail

          fail=0

          # See the tree-wide guard below for why a bare `|| true` is unsafe here:
          # it would mask a broken grep (exit >=2) as "no matches found".
          run_grep() {
            local out status
            out=$("$@") ; status=$?
            if [ "$status" -gt 1 ]; then
              echo "BLOCKED: guard command failed (exit $status): $*" >&2
              exit 1
            fi
            printf '%s' "$out"
          }

          # --- AC3: colour literals live ONLY in theme.css ---------------------
          # Component stylesheets must reference var(--token). A hard-coded hex,
          # rgb() or hsl() in a *.module.css is how the pinned palette gets
          # bypassed one component at a time until the shell no longer matches
          # *arr while every other gate stays green.
          colour_pattern='#[0-9a-fA-F]{3,8}\b|rgba?\(|hsla?\('
          hits=''
          while IFS= read -r f; do
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges' "$f")
            m=$(printf '%s' "$stripped" | grep -nE "$colour_pattern" || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f -name '*.module.css')
          if [ -n "$hits" ]; then
            echo "BLOCKED (AC3): colour literal in a component stylesheet. Use var(--token) from src/styles/theme.css:" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- Dark theme is not optional --------------------------------------
          # A light-mode block or a theme switch would let the shell render light
          # without AC-CHROME noticing: those assertions read :root, which a
          # media query or [data-theme] override can shadow at runtime.
          # Comments are stripped before scanning. theme.css documents the rule
          # ("no prefers-color-scheme: light block, no [data-theme] switch") and a
          # naive grep matches that prose and blocks on its own documentation. The
          # cure is to scan declarations rather than to weaken the pattern -- a
          # looser pattern would let a real light-mode block through, which is the
          # entire failure this guard exists to prevent.
          theme_pattern='prefers-color-scheme[[:space:]]*:[[:space:]]*light|\[data-theme'
          hits=''
          while IFS= read -r f; do
            # Strip /* ... */ (including multi-line) and // comments, keeping line
            # numbering intact so the report still points at a real line.
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges; s{//.*$}{}gm' "$f")
            m=$(printf '%s' "$stripped" | grep -nE "$theme_pattern" || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f \( -name '*.css' -o -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$hits" ]; then
            echo "BLOCKED: light-theme block or theme switch found. The shell is dark-only:" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- The admin key is session-only ------------------------------------
          # It must live in the Zustand store and nowhere persistent. Web storage
          # survives tab close and is readable by any script on the origin.
          #
          # Comments are stripped first, for the same reason as the theme guard
          # above: adminKeyStore.ts documents the rule in prose ("not written to
          # localStorage, not to sessionStorage") and an unstripped grep blocks
          # on its own documentation.
          #
          # *.test.ts(x) is excluded. The guard's subject is production code that
          # WRITES the key to storage; adminKeyStore.test.ts asserts both stores
          # are EMPTY after a key is set, which is the negation of a violation and
          # cannot be written without naming them. Excluding tests loses nothing:
          # a test file ships no runtime behaviour, and a persist middleware added
          # to the store would still be caught in the source it is added to -- and
          # caught a second time by that very assertion.
          hits=''
          while IFS= read -r f; do
            case "$f" in *.test.ts|*.test.tsx) continue ;; esac
            stripped=$(perl -0777 -pe 's{/\*.*?\*/}{ $& =~ tr/\n//cdr }ges; s{//.*$}{}gm' "$f")
            m=$(printf '%s' "$stripped" | grep -nE 'localStorage|sessionStorage' || true)
            if [ -n "$m" ]; then
              hits="${hits}${f}:${m}"$'\n'
            fi
          done < <(find src -type f \( -name '*.ts' -o -name '*.tsx' \))
          if [ -n "$hits" ]; then
            echo "BLOCKED: web storage referenced in src/. The admin key is session-only (Zustand):" >&2
            echo "$hits" >&2
            fail=1
          fi

          # --- theme.css must actually define the palette ------------------------
          # Guards the guards: if theme.css were emptied or renamed, every AC-CHROME
          # read would throw on an empty token and the failure would look like a
          # broken harness rather than a deleted palette.
          for token in --bg-app --bg-sidebar --bg-panel --border --fg-primary --accent; do
            if ! grep -qE "^[[:space:]]*${token}:" src/styles/theme.css; then
              echo "BLOCKED: ${token} is not defined in src/styles/theme.css." >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Frontend chrome guards passed."

      - name: Frontend tests
        # arb-e2x: `shell: bash` is explicit because this file has no
        # `defaults.run.shell` -- every step sets it individually -- and the tee
        # below needs pipefail to be the thing that decides the exit code.
        # Without it the pipeline would report tee's status and a failing suite
        # would go green. `npm test` writes vitest-report.json (the JSON
        # reporter the count step reads), so on failure the report AND this
        # console log both ride up in the failed-attempt artifact below.
        shell: bash
        working-directory: src/Arbitarr.Web
        run: |
          set -euo pipefail
          npm test 2>&1 | tee vitest-console.log

      # arb-5fs: same dispatch-only switch as the backend group's, see that
      # step's comment. The event_name guard means push/pull_request runs
      # never see this step fire.
      - name: Simulate test failure (frontend)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_test_failure }}
        shell: bash
        run: exit 1

      - name: Read frontend test count
        id: count
        shell: bash
        working-directory: src/Arbitarr.Web
        run: |
          set -euo pipefail

          report="vitest-report.json"
          if [ ! -f "$report" ]; then
            echo "BLOCKED: $report is missing -- the test step must emit the JSON reporter." >&2
            exit 1
          fi

          # numPassedTests, not numTotalTests: a skipped or todo test must not be
          # able to hold the floor up without actually running. node is already on
          # PATH from the Setup Node step, so parse with it rather than with a
          # regex over JSON.
          total=$(node -p "require('./${report}').numPassedTests")
          if [ -z "$total" ] || [ "$total" = "undefined" ]; then
            echo "BLOCKED: could not read numPassedTests from $report." >&2
            exit 1
          fi

          echo "Frontend passed test count: $total"
          echo "count=$total" >> "$GITHUB_OUTPUT"

      # arb-e2x: the frontend half of the same problem -- see the backend
      # failed-attempt step for the two mechanisms (a rerun overwrites the job
      # log; short retention removes the rest) and the arb-agh incident behind
      # them. vitest-report.json is the JSON reporter's output and
      # vitest-console.log is the teed console text, which is where a failing
      # assertion's diff actually appears.
      #
      # The name does not match `trx-*`, so the gate never sees it. The frontend
      # count reaches the gate through the job OUTPUT above, not through an
      # artifact, so nothing here can affect the ratchet.
      - name: Upload failed attempt evidence (frontend)
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: failed-attempt-${{ github.run_attempt }}-frontend
          path: |
            src/Arbitarr.Web/vitest-report.json
            src/Arbitarr.Web/vitest-console.log
          # warn, not error: this step runs on any failure in the job, including
          # a typecheck or lint failure that happens before the test step writes
          # either file.
          if-no-files-found: warn
          retention-days: 14


  # --------------------------------------------------------------------------
  # guards: the tree-wide secret/topology sweep, on its own runner. It needs
  # nothing but a checkout (it is git grep over the tracked tree), so hanging it
  # off the build meant a ~10 s check waited minutes for a compiler it never
  # used. Its position relative to the test steps carried no meaning -- it scans
  # the tree, not the results.
  # --------------------------------------------------------------------------
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Tree-wide secret/topology guard
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          # grep/git-grep exit codes: 0 = match found, 1 = no match (expected, not an error),
          # >=2 = a real error (bad pattern, I/O failure, etc.). A bare `|| true` after these
          # calls would mask exit >=2 the same as exit 1, silently turning a broken guard into
          # a no-op pass. run_grep captures output AND the exit code, and only tolerates 0/1.
          run_grep() {
            local out status
            out=$("$@") ; status=$?
            if [ "$status" -gt 1 ]; then
              echo "BLOCKED: guard command failed (exit $status): $*" >&2
              exit 1
            fi
            printf '%s' "$out"
          }

          # 1. Private/LAN IP ranges (RFC 1918) anywhere in the tracked tree. Built up from
          # octet ranges (not a literal private dotted-quad) so this guard does not trip on
          # its own source. Mirrors .git/hooks/pre-commit's pattern. Anchored on
          # (^|[^0-9.]) / ([^0-9.]|$) rather than \b so a real dotted-quad can't hide by
          # extending the run of digits/dots past a \b word boundary.
          oct2="[0-9]{1,3}"
          p1="192\.168\.${oct2}\.${oct2}"
          p2="10\.${oct2}\.${oct2}\.${oct2}"
          p3="172\.(1[6-9]|2[0-9]|3[01])\.${oct2}\.${oct2}"
          ip_pattern="(^|[^0-9.])(${p1}|${p2}|${p3})([^0-9.]|\$)"

          hits=$(run_grep git grep -aInE "$ip_pattern" -- .)
          if [ -n "$hits" ]; then
            echo "BLOCKED: private LAN IP address found in tracked tree (use 192.0.2.x documentation range instead):" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 2. Credential-looking patterns. The allowlist is checked against the matched VALUE
          # only (not the whole line), so a real secret can't hide behind an unrelated allowlist
          # word elsewhere on the same line (e.g. a trailing "# example" comment).
          cred_pattern='(^|[^A-Za-z0-9])((apikey|api_key|password|passwd|secret|token)["'"'"' ]*[=:]["'"'"' ]*|bearer +)([A-Za-z0-9+/_-]{16,})'
          allowlist='^(REDACTED|secret-api-key|placeholder|example|your-|xxxx)'

          hits=$(run_grep git grep -anE "$cred_pattern" -- . | while IFS=: read -r file line rest; do
            value=$(printf '%s\n' "$rest" | grep -oE "$cred_pattern" | tail -1 | grep -oE '[A-Za-z0-9+/_-]{16,}$' || true)
            if [ -n "$value" ] && ! printf '%s\n' "$value" | grep -qiE "$allowlist"; then
              printf '%s:%s:%s\n' "$file" "$line" "$rest"
            fi
          done)
          if [ -n "$hits" ]; then
            echo "BLOCKED: credential-looking value found in tracked tree:" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 2b. Keyword-less, high-signal secret shapes (AWS access key, GitHub PAT, JWT, PEM
          # private key header). Built from split literals so this guard's own source never
          # matches its own detection patterns.
          akia_pat="AKIA[0-9A-Z]{16}"
          ghp_pat="ghp_[A-Za-z0-9]{36}"
          jwt_pat="eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"
          pem_pat="-----BEGIN"' [A-Z ]*'"PRIVATE KEY-----"
          shape_pattern="${akia_pat}|${ghp_pat}|${jwt_pat}|${pem_pat}"

          hits=$(run_grep git grep -aInE "$shape_pattern" -- .)
          if [ -n "$hits" ]; then
            echo "BLOCKED: high-signal secret shape (AWS/GitHub/JWT/PEM) found in tracked tree:" >&2
            echo "$hits" | head -20 >&2
            fail=1
          fi

          # 3. Files that should never be committed at all.
          sensitive_files=$(git ls-files -- '*.env' '*.pfx' '*.p12' '*.key' '*.pem' '*.snk' '*secrets.json' '*appsettings.Local.json')
          if [ -n "$sensitive_files" ]; then
            echo "BLOCKED: sensitive file present in tracked tree:" >&2
            echo "$sensitive_files" >&2
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "Tree-wide guard failed. This re-runs the .git/hooks/pre-commit checks over the" >&2
            echo "whole tree so the guarantee does not depend on contributors configuring hooks." >&2
            exit 1
          fi

          echo "Tree-wide secret/topology guard passed."

      # arb-bj7: nothing else checks that the four backend matrix groups
      # (A1/A2/B/C) together cover EXACTLY the assemblies
      # TEST_ASSEMBLIES names. A one-token deletion in a rebase leaves the dll
      # present in the prep artifact (that assertion passes) but simply unrun
      # by any group; the gate's trx-set check (arb-6ke) would then report it
      # as a "missing trx", which is correct but arrives late, only on the
      # affected PR, and without pointing at the matrix as the cause. This
      # step catches the same fault earlier and directly, on every PR, with no
      # artifact needed -- guards runs standalone.
      #
      # The extraction below is a narrow literal-line scan, not a YAML parser:
      # it reads only `assemblies: "..."` lines between the backend job's
      # `matrix:` and `steps:` keys. python3 is available on ubuntu-latest
      # runners but NOT in local git-bash, and this step must also run
      # locally as a positive control, so it is kept to awk/sed rather than a
      # YAML library. That narrowness is deliberate: if the matrix is ever
      # reformatted (flow sequence, block scalar, different key or indent),
      # the extraction must find ZERO assemblies lines and fail loudly on an
      # empty union below, never silently produce a partial or wrong one.
      - name: Verify matrix groups union to the asserted assemblies
        shell: bash
        run: |
          set -euo pipefail

          workflow_file=".github/workflows/build-test.yml"

          assemblies_lines=$(awk '
            /^[[:space:]]*matrix:[[:space:]]*$/ { in_matrix=1 }
            in_matrix && /^[[:space:]]*steps:[[:space:]]*$/ { exit }
            in_matrix && /^[[:space:]]*assemblies:[[:space:]]*"/ { print }
          ' "$workflow_file")

          if [ -z "$assemblies_lines" ]; then
            echo "BLOCKED: no 'assemblies: \"...\"' lines found under the backend job's matrix." >&2
            echo "in ${workflow_file}. The extraction expects one such line per matrix group;" >&2
            echo "if the matrix was reformatted (flow sequence, block scalar, different" >&2
            echo "key/indent), update this extraction rather than letting the union check" >&2
            echo "pass vacuously over zero entries." >&2
            exit 1
          fi

          # A PARTIAL reformat (one group's assemblies line switched to single
          # quotes, folded onto a block scalar, etc.) does not zero out
          # assemblies_lines above -- it just makes the extraction miss that one
          # group, and the union check below would then report the group's
          # assemblies as "missing from the matrix", which points at the wrong
          # cause: the assemblies are still there, the extraction just can't see
          # them. Counting `- group:` entries and comparing against the number of
          # extracted lines catches exactly this case, before the union logic
          # runs, with a message that says what actually broke.
          group_count=$(awk '
            /^[[:space:]]*matrix:[[:space:]]*$/ { in_matrix=1 }
            in_matrix && /^[[:space:]]*steps:[[:space:]]*$/ { exit }
            in_matrix && /^[[:space:]]*-[[:space:]]*group:/ { n++ }
            END { print n+0 }
          ' "$workflow_file")

          assemblies_count=$(printf '%s\n' "$assemblies_lines" | sed '/^$/d' | wc -l)

          if [ "$assemblies_count" -ne "$group_count" ]; then
            echo "BLOCKED: extraction broke -- found ${group_count} '- group:' entries but" >&2
            echo "only ${assemblies_count} 'assemblies: \"...\"' lines in ${workflow_file}." >&2
            echo "This means the matrix was partially reformatted (a group's assemblies line" >&2
            echo "no longer matches the narrow literal-line scan this step uses), not that" >&2
            echo "assemblies are missing from the matrix. Fix the extraction to match the new" >&2
            echo "format, or revert the reformat." >&2
            exit 1
          fi

          union_list=$(printf '%s\n' "$assemblies_lines" \
            | sed -E 's/^[[:space:]]*assemblies:[[:space:]]*"([^"]*)".*$/\1/' \
            | tr ' ' '\n' \
            | sed '/^$/d')

          union_sorted=$(printf '%s\n' "$union_list" | sort -u)
          expected_sorted=$(printf '%s\n' $TEST_ASSEMBLIES | sort -u)

          missing_from_matrix=$(comm -23 <(printf '%s\n' "$expected_sorted") <(printf '%s\n' "$union_sorted"))
          extra_in_matrix=$(comm -13 <(printf '%s\n' "$expected_sorted") <(printf '%s\n' "$union_sorted"))

          if [ -n "$missing_from_matrix" ] || [ -n "$extra_in_matrix" ]; then
            echo "BLOCKED: matrix groups do not union to exactly TEST_ASSEMBLIES." >&2
            [ -n "$missing_from_matrix" ] && { echo "Missing from the matrix (in TEST_ASSEMBLIES, not run by any group):" >&2; echo "$missing_from_matrix" | sed 's/^/  /' >&2; }
            [ -n "$extra_in_matrix" ] && { echo "Extra in the matrix (not in TEST_ASSEMBLIES):" >&2; echo "$extra_in_matrix" | sed 's/^/  /' >&2; }
            exit 1
          fi

          # --- shard rules (arb-adm) ------------------------------------------
          # Before this bead a repeated assembly token was ALWAYS a fault, and
          # `uniq -d` on union_list said so. Sharding makes a repeat legal in
          # exactly one shape, so the blanket duplicate check is replaced by a
          # narrower one rather than deleted: a token may repeat only when it is
          # named in SHARD_ASSEMBLIES and its entries carry exactly the shards
          # 1of<N>..<N>of<N>, one each. Every other repeat is still a failure by
          # name, and so is a `shard:` on an assembly SHARD_ASSEMBLIES does not
          # name -- which is what stops a shard being introduced by editing the
          # matrix alone.
          #
          # The `shard:` extraction mirrors the `assemblies:` one above: the same
          # narrow literal-line scan over the same in_matrix window. It does NOT
          # require one shard line per group (unsharded entries have none), so it
          # cannot use the group-count cross-check; instead each shard line is
          # paired with the assembly of the `- group:` entry it falls under, by
          # walking the window in order. A reformat that hides a shard line makes
          # its assembly look unsharded, which the completeness check below then
          # reports as an incomplete shard set rather than passing silently.
          pairs=$(awk '
            /^[[:space:]]*matrix:[[:space:]]*$/ { in_matrix=1 }
            in_matrix && /^[[:space:]]*steps:[[:space:]]*$/ { exit }
            in_matrix && /^[[:space:]]*-[[:space:]]*group:/ { asm=""; shard="" }
            in_matrix && /^[[:space:]]*assemblies:[[:space:]]*"/ {
              line=$0
              sub(/^[[:space:]]*assemblies:[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              asm=line
            }
            in_matrix && /^[[:space:]]*shard:[[:space:]]*"/ {
              line=$0
              sub(/^[[:space:]]*shard:[[:space:]]*"/, "", line)
              sub(/".*$/, "", line)
              shard=line
              print asm "\t" shard
            }
          ' "$workflow_file")

          shard_fail=0

          # Every assembly that carries a shard must be allow-listed.
          while IFS=$'\t' read -r asm shard; do
            [ -n "$asm" ] || continue
            allowed=0
            for tok in $SHARD_ASSEMBLIES; do
              [ "${tok%%:*}" = "$asm" ] && allowed=1
            done
            if [ "$allowed" -ne 1 ]; then
              echo "BLOCKED: matrix entry for ${asm} carries shard \"${shard}\" but ${asm} is not" >&2
              echo "named in SHARD_ASSEMBLIES. Add it there deliberately, or drop the shard." >&2
              shard_fail=1
            fi
          done <<< "$pairs"

          # Every allow-listed assembly must carry exactly 1of<N>..<N>of<N>, once each.
          for tok in $SHARD_ASSEMBLIES; do
            asm="${tok%%:*}"
            n="${tok##*:}"
            got=$(printf '%s\n' "$pairs" | awk -F'\t' -v a="$asm" '$1 == a { print $2 }' | sort)
            want=$(seq 1 "$n" | sed "s|\$|of${n}|" | sort)
            if [ "$got" != "$want" ]; then
              echo "BLOCKED: ${asm} is declared as ${n} shards in SHARD_ASSEMBLIES but its matrix" >&2
              echo "entries do not carry exactly one of each of ${n} shards." >&2
              echo "Expected: $(printf '%s ' $want)" >&2
              echo "Found:    $(printf '%s ' $got)" >&2
              echo "A missing shard silently stops running those tests; a duplicated one runs" >&2
              echo "them twice and double-counts them against the ratchet floor." >&2
              shard_fail=1
            fi
          done

          # A token may repeat ONLY as many times as it is sharded.
          while read -r cnt asm; do
            [ -n "$asm" ] || continue
            allowed_n=1
            for tok in $SHARD_ASSEMBLIES; do
              [ "${tok%%:*}" = "$asm" ] && allowed_n="${tok##*:}"
            done
            if [ "$cnt" -ne "$allowed_n" ]; then
              echo "BLOCKED: ${asm} appears ${cnt} times across the matrix but may appear" >&2
              echo "${allowed_n} time(s) (unsharded assemblies once; sharded ones once per" >&2
              echo "shard declared in SHARD_ASSEMBLIES)." >&2
              shard_fail=1
            fi
          done <<< "$(printf '%s\n' "$union_list" | sort | uniq -c | sed 's/^[[:space:]]*//')"

          if [ "$shard_fail" -ne 0 ]; then
            exit 1
          fi

          echo "Matrix groups union to exactly TEST_ASSEMBLIES."
          if [ -n "${SHARD_ASSEMBLIES:-}" ]; then
            echo "Shard sets complete for: ${SHARD_ASSEMBLIES}"
          else
            echo "No assembly is sharded (SHARD_ASSEMBLIES is empty)."
          fi

      # arb-03v: the check above proves the matrix union equals TEST_ASSEMBLIES,
      # but nothing proves TEST_ASSEMBLIES itself still matches the tests/ tree.
      # An eleventh tests/*.Tests project (or a rename) is otherwise INVISIBLE to
      # the merge lane: prep's build-output assertion, the matrix-union step and
      # the gate's trx-set check all consume the same hand-maintained list, so a
      # project missing from that list simply never runs and the ratchet floor
      # ratchets over the smaller set without ever failing red. nightly.yml
      # already catches this (`find tests -name '*.Tests.csproj'`, asserted
      # against a hard-coded `expected=10`) but nightly is not a required check
      # and runs once a day, so a bad PR merges hours before anyone notices.
      # This step is the same discovery, in the required lane, diffed by name
      # against TEST_ASSEMBLIES instead of only counting. nightly.yml's own
      # expected=10 assertion is intentionally left as-is: it is an independent
      # measurement, not a copy of this one, and deleting it would remove the
      # one check that still runs even if this file's guards job is ever
      # bypassed or disabled.
      - name: Verify TEST_ASSEMBLIES matches the tests/ tree
        shell: bash
        run: |
          set -euo pipefail

          tree_list=$(find tests -name '*.Tests.csproj' -exec basename {} .csproj \; | sort)

          if [ -z "$tree_list" ]; then
            echo "BLOCKED: no '*.Tests.csproj' found under tests/. Either the tree" >&2
            echo "was moved/renamed or this find expression broke -- a check that passes" >&2
            echo "vacuously over zero projects is worse than no check at all." >&2
            exit 1
          fi

          expected_sorted=$(printf '%s\n' $TEST_ASSEMBLIES | sort -u)

          missing_from_list=$(comm -23 <(printf '%s\n' "$tree_list") <(printf '%s\n' "$expected_sorted"))
          missing_from_tree=$(comm -13 <(printf '%s\n' "$tree_list") <(printf '%s\n' "$expected_sorted"))

          if [ -n "$missing_from_list" ] || [ -n "$missing_from_tree" ]; then
            echo "BLOCKED: TEST_ASSEMBLIES does not match the tests/ tree." >&2
            [ -n "$missing_from_list" ] && { echo "In the tree, missing from TEST_ASSEMBLIES:" >&2; echo "$missing_from_list" | sed 's/^/  /' >&2; }
            [ -n "$missing_from_tree" ] && { echo "In TEST_ASSEMBLIES, no matching project in the tree:" >&2; echo "$missing_from_tree" | sed 's/^/  /' >&2; }
            exit 1
          fi

          echo "TEST_ASSEMBLIES matches the tests/ tree exactly: $(printf '%s\n' "$tree_list" | tr '\n' ' ')"

      # arb-9ae: BuiltAssemblies.cs (arb-hxa; formerly ProductionProcessGlobalStateTests.cs
      # directly) scans src/ assemblies by FILE PATH, not through
      # Architecture.Tests.csproj's ProjectReference graph (that scan exists
      # precisely because Arbitarr.Host cannot be a ProjectReference there --
      # NU1605; see the csproj's own Mono.Cecil comment). Nothing previously
      # enforced that its hand-written ProductionAssemblyNames array still
      # matches the reference graph plus the one documented exception: a name
      # added to the array with no matching ProjectReference (and not
      # allow-listed) would scan an assembly no build guarantees exists yet,
      # and a name that WAS allow-listed but has since gained a real
      # ProjectReference would leave a stale allow-list entry masking a graph
      # that could now do the job on its own.
      #
      # arb-2p6: the check is bidirectional. A src project added as a
      # ProjectReference but never added to ProductionAssemblyNames is caught
      # too (comm -13 below) -- otherwise it silently escapes the scan (and the
      # ClearAllPools/global-state bans it enforces), which is exactly the
      # vacuous-pass class the array's own doc comment argues against.
      #
      # The extraction below is a NARROW sed address range, not a C# parser
      # (scripts/test-affected.sh's own comment bans parsing C# from bash for
      # the same reason: this step runs in CI only). It matches from the
      # opening `internal static readonly string[] ProductionAssemblyNames =`
      # declaration line (arb-hxa: `internal`, not `private` -- the field must
      # be visible outside BuiltAssemblies to its four consumer classes) to
      # the closing `    ];` line and reads only the `"Name",` entries between
      # them. If that shape changes (renamed field, reformatted array,
      # different indent, a visibility change), the range must find ZERO
      # lines and fail loudly below -- never silently produce a partial or
      # empty list that then passes the union checks vacuously.
      - name: Verify Architecture.Tests scan list and reference graph match in both directions
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${TEST_ASSEMBLIES:-}" ] || { echo "BLOCKED: TEST_ASSEMBLIES is empty" >&2; exit 1; }

          scan_file="tests/Arbitarr.Architecture.Tests/BuiltAssemblies.cs"
          csproj_file="tests/Arbitarr.Architecture.Tests/Arbitarr.Architecture.Tests.csproj"

          # Arbitarr.Host is the one documented exception: NU1605 blocks
          # Architecture.Tests.csproj from taking a ProjectReference on it, so
          # its IL is read by file path instead (see the csproj comment and
          # scripts/test-affected.sh's "2b" block). A name belongs here only
          # when there is a real, currently-true reason it cannot be a
          # ProjectReference -- not as a place to park a name that could be
          # referenced instead.
          allow_listed="Arbitarr.Host"

          scanned_names=$(sed -n '/^[[:space:]]*internal static readonly string\[\] ProductionAssemblyNames =[[:space:]]*$/,/^[[:space:]]*\];[[:space:]]*$/p' "$scan_file" \
            | sed -n 's/^[[:space:]]*"\([A-Za-z0-9.]*\)",\{0,1\}[[:space:]]*$/\1/p')

          if [ -z "$scanned_names" ]; then
            echo "BLOCKED: found no assembly names between the 'ProductionAssemblyNames ='" >&2
            echo "declaration and its closing '];' in ${scan_file}. This extraction is a" >&2
            echo "narrow sed range over that exact shape (8-space indented \"Name\", entries" >&2
            echo "between an 'internal static readonly string[] ProductionAssemblyNames =' line" >&2
            echo "and a bare '];' line) -- if the array was renamed, reformatted, or its" >&2
            echo "visibility changed, fix this extraction rather than letting the checks below" >&2
            echo "pass vacuously over zero names." >&2
            exit 1
          fi

          referenced_names=$(grep -oE 'Include="[.][.][\][.][.][\]src[\][A-Za-z0-9.]+[\]' "$csproj_file" || true)
          referenced_names=$(printf '%s' "$referenced_names" \
            | sed -E 's/^Include="[.][.][\][.][.][\]src[\]([A-Za-z0-9.]+)[\]$/\1/' \
            | sort -u)

          if [ -z "$referenced_names" ]; then
            echo "BLOCKED: found no ProjectReference entries matching the expected shape in" >&2
            echo "${csproj_file}. This extraction looks for" >&2
            echo '  Include="..\..\src\<Name>\<Name>.csproj"' >&2
            echo "(Windows backslashes) -- if the csproj now uses forward slashes, a" >&2
            echo "different relative path, or has no src/ ProjectReferences left, update this" >&2
            echo "extraction's pattern rather than letting the checks below pass vacuously" >&2
            echo "over zero referenced names." >&2
            exit 1
          fi

          scanned_sorted=$(printf '%s\n' "$scanned_names" | sort -u)
          allow_listed_sorted=$(printf '%s\n' "$allow_listed" | sort -u)

          unreferenced=$(comm -23 <(printf '%s\n' "$scanned_sorted") <(printf '%s\n' "$referenced_names"))
          unreferenced_unlisted=$(comm -23 <(printf '%s\n' "$unreferenced") <(printf '%s\n' "$allow_listed_sorted"))
          stale_allow_listed=$(comm -12 <(printf '%s\n' "$allow_listed_sorted") <(printf '%s\n' "$referenced_names"))
          # arb-2p6: the reverse direction. A src project added as a ProjectReference but
          # never added to ProductionAssemblyNames silently escapes the scan (and the
          # ClearAllPools/global-state bans it enforces) -- the same vacuous-pass class the
          # array's own doc comment argues against, just approached from the other set.
          unscanned=$(comm -13 <(printf '%s\n' "$scanned_sorted") <(printf '%s\n' "$referenced_names"))

          if [ -n "$unreferenced_unlisted" ] || [ -n "$stale_allow_listed" ] || [ -n "$unscanned" ]; then
            echo "BLOCKED: ${scan_file}'s ProductionAssemblyNames drifted from the" >&2
            echo "Architecture.Tests reference graph." >&2
            if [ -n "$unreferenced_unlisted" ]; then
              echo "Scanned but neither referenced nor allow-listed (add a ProjectReference in" >&2
              echo "${csproj_file}, or add the name to the allow_listed variable in this step" >&2
              echo "AND to the hard-coded Host case in scripts/test-affected.sh's '2b' block):" >&2
              echo "$unreferenced_unlisted" | sed 's/^/  /' >&2
            fi
            if [ -n "$stale_allow_listed" ]; then
              echo "Allow-listed here but now has a real ProjectReference -- remove it from the" >&2
              echo "allow_listed variable in this step (leave scripts/test-affected.sh's Host" >&2
              echo "case alone unless Host itself is the name being removed):" >&2
              echo "$stale_allow_listed" | sed 's/^/  /' >&2
            fi
            if [ -n "$unscanned" ]; then
              echo "Referenced by ${csproj_file} but not in ${scan_file}'s ProductionAssemblyNames" >&2
              echo "-- this project's IL is never scanned, so it silently escapes the" >&2
              echo "ClearAllPools/global-state bans. Add it to ProductionAssemblyNames, or if it" >&2
              echo "is deliberately unscanned, explain why in a comment there rather than" >&2
              echo "leaving it silently absent:" >&2
              echo "$unscanned" | sed 's/^/  /' >&2
            fi
            exit 1
          fi

          echo "Every scanned assembly is referenced or allow-listed (no stale allow-list entries), and every referenced src project is scanned."

      # arb-hbt: BuiltAssemblies.TestAssemblyNames (arb-hxa) is the C# list the IL
      # scans in TestProcessGlobalStateTests and QuarantineTraitTests iterate over,
      # and it is DELIBERATELY INDEPENDENT of TEST_ASSEMBLIES above (see the class
      # remarks in BuiltAssemblies.cs) -- the two guards below exist precisely to
      # catch drift between them, not to merge them into one source of truth. Until
      # this step, nothing diffed TestAssemblyNames against TEST_ASSEMBLIES: a name
      # deleted from the C# list just made the scans iterate nine assemblies
      # instead of the full set, with no count or set assertion anywhere to notice (found by
      # worker-20 while doing arb-hxa -- the intended positive control for that
      # work did not fail anything before or after the extraction).
      #
      # The extraction is the SAME narrow sed range technique as
      # ProductionAssemblyNames above, keyed to TestAssemblyNames' own declaration
      # shape instead: from the opening `internal static readonly string[]
      # TestAssemblyNames =` line to the closing bare `];` line, reading only
      # `"Name",` entries between them. A reformatted declaration makes the range
      # find ZERO names, which fails loudly below rather than letting the diff pass
      # vacuously over an empty list.
      - name: Verify BuiltAssemblies.TestAssemblyNames matches TEST_ASSEMBLIES
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${TEST_ASSEMBLIES:-}" ] || { echo "BLOCKED: TEST_ASSEMBLIES is empty" >&2; exit 1; }

          scan_file="tests/Arbitarr.Architecture.Tests/BuiltAssemblies.cs"

          scanned_names=$(sed -n '/^[[:space:]]*internal static readonly string\[\] TestAssemblyNames =[[:space:]]*$/,/^[[:space:]]*\];[[:space:]]*$/p' "$scan_file" \
            | sed -n 's/^[[:space:]]*"\([A-Za-z0-9.]*\)",\{0,1\}[[:space:]]*$/\1/p')

          if [ -z "$scanned_names" ]; then
            echo "BLOCKED: found no assembly names between the 'TestAssemblyNames ='" >&2
            echo "declaration and its closing '];' in ${scan_file}. This extraction is a" >&2
            echo "narrow sed range over that exact shape (8-space indented \"Name\", entries" >&2
            echo "between an 'internal static readonly string[] TestAssemblyNames =' line" >&2
            echo "and a bare '];' line) -- if the array was renamed, reformatted, or its" >&2
            echo "visibility changed, fix this extraction rather than letting the diff below" >&2
            echo "pass vacuously over zero names." >&2
            exit 1
          fi

          scanned_sorted=$(printf '%s\n' "$scanned_names" | sort -u)
          expected_sorted=$(printf '%s\n' $TEST_ASSEMBLIES | sort -u)

          missing_from_list=$(comm -23 <(printf '%s\n' "$expected_sorted") <(printf '%s\n' "$scanned_sorted"))
          extra_in_list=$(comm -13 <(printf '%s\n' "$expected_sorted") <(printf '%s\n' "$scanned_sorted"))

          if [ -n "$missing_from_list" ] || [ -n "$extra_in_list" ]; then
            echo "BLOCKED: ${scan_file}'s TestAssemblyNames drifted from TEST_ASSEMBLIES." >&2
            [ -n "$missing_from_list" ] && { echo "In TEST_ASSEMBLIES, missing from TestAssemblyNames (the IL scans silently" >&2; echo "skip these):" >&2; echo "$missing_from_list" | sed 's/^/  /' >&2; }
            [ -n "$extra_in_list" ] && { echo "In TestAssemblyNames, not in TEST_ASSEMBLIES (scans an assembly this build" >&2; echo "does not produce):" >&2; echo "$extra_in_list" | sed 's/^/  /' >&2; }
            exit 1
          fi

          echo "BuiltAssemblies.TestAssemblyNames matches TEST_ASSEMBLIES exactly."

      # arb-5sg (1 of 2): a tests/*.Tests project that is in TEST_ASSEMBLIES
      # and present in the tree but missing from Arbitarr.sln builds no dll --
      # `dotnet build Arbitarr.sln` in prep never sees it -- and the failure
      # first surfaces at prep's "Assert the build output was restored" step
      # with a message about a missing test-build artifact, which points at
      # the artifact rather than at the actual cause. This step catches the
      # same fault earlier, in guards (which needs nothing built), and names
      # the sln directly.
      #
      # Arbitarr.sln is LF, and each test project's entry is a literal
      # `tests\<Name>\<Name>.csproj` path with WINDOWS backslashes even though
      # the file itself is not CRLF (verified with `git ls-files --eol` and a
      # raw read of the file) -- this is the sln format's own convention, not
      # a line-ending artifact, so the check greps for that exact backslash
      # form rather than a slash-normalised one.
      #
      # arb-exw: presence in the sln is not enough -- `dotnet build Arbitarr.sln`
      # (prep, above: `-c Release`) only actually builds a project whose GUID has a
      # `{GUID}.Release|Any CPU.Build.0` line under
      # GlobalSection(ProjectConfigurationPlatforms); Debug is never built by this
      # workflow, so only Release is required here. A project with a `Project(...)`
      # line but no matching Build.0 mapping is silently skipped by that build --
      # no error, no dll -- which is exactly the failure this step's Project-line
      # check used to claim it caught. The GUID is resolved per name from its own
      # `Project(...) = "<Name>", "tests\<Name>\<Name>.csproj", "{GUID}"` line so the
      # Build.0 grep cannot match a different project's mapping by coincidence.
      - name: Verify every test project is in Arbitarr.sln and overrides no AssemblyName
        shell: bash
        run: |
          set -euo pipefail

          [ -n "${TEST_ASSEMBLIES:-}" ] || { echo "BLOCKED: TEST_ASSEMBLIES is empty" >&2; exit 1; }

          sln_file="Arbitarr.sln"

          missing_from_sln=""
          for name in $TEST_ASSEMBLIES; do
            pattern='tests\'"$name"'\'"$name"'.csproj'
            if ! grep -qF "$pattern" "$sln_file"; then
              missing_from_sln="${missing_from_sln}${name}"$'\n'
            fi
          done

          if [ -n "$missing_from_sln" ]; then
            echo "BLOCKED: ${sln_file} is missing a test project that TEST_ASSEMBLIES names." >&2
            echo "Every consumer (prep's build-output assertion, the backend dll path, and" >&2
            echo "LogFileName) derives the dll and trx names from the TEST_ASSEMBLIES token, so" >&2
            echo "a project absent from the sln builds nothing and fails downstream with a" >&2
            echo "message that points at the missing artifact, not at the sln. Add the missing" >&2
            echo "project(s) to ${sln_file}:" >&2
            printf '%s' "$missing_from_sln" | sed 's/^/  /' >&2
            exit 1
          fi

          # arb-exw: presence in the sln does not mean the project actually builds --
          # resolve each name's GUID from its Project(...) line, then require a
          # Release|Any CPU.Build.0 mapping for that GUID (Release is the only
          # configuration prep's `dotnet build Arbitarr.sln -c Release` builds).
          missing_build0=""
          for name in $TEST_ASSEMBLIES; do
            pattern='tests\'"$name"'\'"$name"'.csproj'
            project_line=$(grep -F "$pattern" "$sln_file" | head -1)
            guid=$(printf '%s' "$project_line" | grep -oE '\{[0-9A-Fa-f-]+\}"$' | grep -oE '\{[0-9A-Fa-f-]+\}' || true)

            if [ -z "$guid" ]; then
              echo "BLOCKED: could not resolve a project GUID for ${name} from its" >&2
              echo "'Project(...) = \"${name}\", \"${pattern}\", \"{GUID}\"' line in" >&2
              echo "${sln_file}. The sln's Project-line shape must have changed; fix this" >&2
              echo "extraction rather than letting the Build.0 check below pass vacuously." >&2
              exit 1
            fi

            if ! grep -qF "${guid}.Release|Any CPU.Build.0" "$sln_file"; then
              missing_build0="${missing_build0}${name} (${guid})"$'\n'
            fi
          done

          if [ -n "$missing_build0" ]; then
            echo "BLOCKED: ${sln_file} has a Project(...) line for a test project but no" >&2
            echo "matching Release|Any CPU.Build.0 mapping under" >&2
            echo "GlobalSection(ProjectConfigurationPlatforms). \`dotnet build Arbitarr.sln -c" >&2
            echo "Release\` silently skips a project in this state -- no error, no dll -- so" >&2
            echo "the earlier presence check passing is not evidence this project actually" >&2
            echo "builds. Add a \"{GUID}.Release|Any CPU.Build.0 = Release|Any CPU\" line (and" >&2
            echo "the matching ActiveCfg, if also missing) for:" >&2
            printf '%s' "$missing_build0" | sed 's/^/  /' >&2
            exit 1
          fi

          echo "Every TEST_ASSEMBLIES project has a Release|Any CPU.Build.0 mapping in ${sln_file}."

          # arb-5sg (2 of 2): every consumer derives the dll and trx BASENAME
          # from the TEST_ASSEMBLIES token, i.e. from the project name --
          # ONLY <AssemblyName> can make that basename diverge from the
          # project name at build time, so only <AssemblyName> is checked
          # here. <RootNamespace> is deliberately NOT checked: it controls
          # the default namespace new files are generated into, never the
          # compiled output's file name, so a RootNamespace override has no
          # mechanism to break the TEST_ASSEMBLIES-derived dll/trx lookup --
          # flagging it would be a rule with no failure it actually catches.
          # (Several test projects already declare a same-name RootNamespace
          # today, which is exactly why a check here would need to special-
          # case "matches the project name" to stay green, and that
          # special-case is a sign the check has no real target.)
          #
          # Any <AssemblyName> declaration fails, even one that happens to
          # repeat the project's own name: unlike RootNamespace, AssemblyName
          # has no legitimate reason to be declared at all in a test project
          # here (none is today), so a same-name AssemblyName is not
          # tolerated as harmless -- it is redundant at best and one edit
          # away from silently diverging at worst. Failing all of them keeps
          # the check simple and keeps that drift from ever being possible.
          # Built FROM $TEST_ASSEMBLIES (tests/<Name>/<Name>.csproj) rather than a
          # tests/*.Tests/*.csproj glob, so this shares the one source of truth with
          # the sln check above instead of silently iterating zero times (and
          # printing the success line below with rc=0) when the glob matches
          # nothing -- e.g. an empty or not-yet-checked-out tests/ tree.
          bad_overrides=""
          for name in $TEST_ASSEMBLIES; do
            csproj="tests/${name}/${name}.csproj"
            if [ ! -f "$csproj" ]; then
              echo "BLOCKED: ${csproj} does not exist. Every name in TEST_ASSEMBLIES must have a" >&2
              echo "matching tests/<Name>/<Name>.csproj on disk for this AssemblyName check (and" >&2
              echo "the sln check above) to mean anything." >&2
              exit 1
            fi
            while IFS= read -r tag_line; do
              [ -z "$tag_line" ] && continue
              bad_overrides="${bad_overrides}${csproj}: ${tag_line}"$'\n'
            done < <(grep -oE '<AssemblyName>[^<]*</AssemblyName>' "$csproj")
          done

          if [ -n "$bad_overrides" ]; then
            echo "BLOCKED: a test project declares <AssemblyName>. Every consumer derives the" >&2
            echo "dll and trx basename from the TEST_ASSEMBLIES token (the project name), so" >&2
            echo "any AssemblyName override -- even one that currently repeats the project" >&2
            echo "name -- produces build output under a name that stops being guaranteed to" >&2
            echo "match TEST_ASSEMBLIES the next time either value changes. Remove it:" >&2
            printf '%s' "$bad_overrides" | sed 's/^/  /' >&2
            exit 1
          fi

          echo "Every TEST_ASSEMBLIES project is in Arbitarr.sln and declares no AssemblyName override."

      # The gate is the only thing standing between a lost shard, a
      # double-counted one or a shrunken suite and a green run, so "the gate
      # went green" is not evidence it CAN go red. This runs the gate's own
      # functions against synthetic fixtures that plant each fault in turn and
      # requires a BLOCK naming the cause -- the positive controls CLAUDE.md
      # section 4 asks for, kept in the tree rather than in a PR body.
      #
      # It sources .github/scripts/test-count-gate.sh and shard-filter.sh, the
      # same files the backend and gate jobs source, so a control that passes is
      # evidence about the text CI runs and not about a copy of it. It needs no
      # build output and no artifacts, which is why it belongs here rather than
      # in the gate job: it can run before anything is compiled.
      - name: Run the test-count gate's positive controls
        shell: bash
        run: |
          set -euo pipefail
          bash ./.github/scripts/test-count-gate-controls.sh

  # --------------------------------------------------------------------------
  # gate: the required check. Named EXACTLY `Build & test` so the existing
  # branch-protection rule keeps matching and NO branch-protection edit is
  # needed -- the job that carried this name before was the whole build, and the
  # name is now carried by the job that aggregates it.
  #
  # `if: always()` is what lets this job run when a needed job failed, so it can
  # report the failure as its own. That makes the explicit result check below
  # THE load-bearing line of this workflow: with `always()`, this job runs
  # regardless, and without that check it would happily succeed on top of a red
  # matrix job. And a SKIPPED job -- which is what a needed job's failure would
  # otherwise make this -- is treated by branch protection as a satisfied
  # required check, not a failed one. So a gate that merely inherited its
  # needs' status would let a red backend group merge. Every needed job's
  # `result` must be `success` explicitly, and anything else fails this job.
  # --------------------------------------------------------------------------
  gate:
    name: Build & test
    runs-on: ubuntu-latest
    needs: [prep, backend, frontend, guards]
    if: always()
    # contents: read is inherited from the workflow-level block above and repeated
    # here because naming a job-level `permissions` replaces it rather than adding
    # to it. actions: read is what lets the floor step query the Actions API for
    # master's last successful run and download its test-counts artifact.
    permissions:
      contents: read
      actions: read
    env:
      # Bootstrap floors, used ONLY when no test-counts artifact can be found on
      # master (first run after this lands, or the artifact has expired). These are
      # the numbers the master push run for the #108 merge (run 34197814222)
      # printed. They are the one place in the ratchet where a count is written by
      # hand: never edit them to anything but a number a master push run actually
      # printed -- a pull_request run measures the PR, not master.
      BOOTSTRAP_BACKEND_FLOOR: "1189"
      BOOTSTRAP_FRONTEND_FLOOR: "296"
      FRONTEND_COUNT: ${{ needs.frontend.outputs.count }}
    steps:
      # ----------------------------------------------------------------------
      # THE load-bearing step. See the job comment above: `if: always()` means
      # this job runs even when a needed job failed, and branch protection
      # counts a skipped required check as satisfied. Neither of those is a bug
      # to work around -- together they are the only way a single required-check
      # name can speak for four jobs -- but they mean the aggregate verdict has
      # to be computed here, explicitly, rather than inherited.
      # ----------------------------------------------------------------------
      - name: Require every needed job to have succeeded
        shell: bash
        env:
          PREP_RESULT: ${{ needs.prep.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
        run: |
          set -euo pipefail

          fail=0
          # `backend` is a matrix job: its aggregated `result` is `success` only
          # when EVERY group succeeded, so one entry covers all four groups.
          for pair in "prep:$PREP_RESULT" "backend:$BACKEND_RESULT" \
                      "frontend:$FRONTEND_RESULT" "guards:$GUARDS_RESULT"; do
            job="${pair%%:*}"
            result="${pair##*:}"
            echo "${job}: ${result}"
            if [ "$result" != "success" ]; then
              echo "BLOCKED: job '${job}' did not succeed (result: ${result})." >&2
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "This gate carries the required-check name 'Build & test' for the whole" >&2
            echo "workflow. It must fail explicitly when any job it aggregates failed, was" >&2
            echo "cancelled or was skipped -- branch protection treats a skipped check as" >&2
            echo "satisfied, so an unchecked gate would let a red matrix job merge." >&2
            exit 1
          fi

          echo "All aggregated jobs succeeded."
      # The gate SOURCES .github/scripts/test-count-gate.sh, so the file has to
      # be on disk -- and this job, alone among the five, had no checkout: it
      # consumed artifacts only. The inline bash this replaced needed none,
      # because it travelled inside the workflow YAML the runner already had.
      # Moving the logic into a file is what made a checkout load-bearing here,
      # and its absence failed this step with "No such file or directory" rather
      # than as a gate verdict.
      #
      # Sparse: only .github/scripts is fetched. The gate reads no other tracked
      # file, and a full checkout would land src/ and tests/ beside the
      # ./TestResults the artifacts download into. Blobless + sparse keeps this
      # to well under a second.
      #
      # AFTER the job-result check above deliberately: that check must be the
      # first thing that can fail here, so a red matrix is reported as a red
      # matrix and never as a checkout error.
      - name: Checkout gate scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: blob:none
          sparse-checkout: .github/scripts

      # ----------------------------------------------------------------------
      # The test-count floor is a ratchet, not a committed file. The floor is
      # whatever master last measured: every run uploads a test-counts artifact,
      # and every run resolves its floor from the latest successful `Build & test`
      # run on master OTHER THAN ITSELF. Selecting "other than itself" is what
      # makes a push to master enforce the ratchet too -- a shrink merged by force
      # is still caught, because master is compared against its own predecessor
      # rather than against nothing.
      #
      # A committed floor file made every two test-adding PRs conflict by
      # construction, and the "measurements, never arithmetic" rule then forced a
      # full re-run of both suites after each rebase. The ratchet keeps the
      # guarantee (a suite cannot silently shrink) with no file to conflict on.
      # ----------------------------------------------------------------------
      - name: Resolve test-count floors from master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          backend_floor="$BOOTSTRAP_BACKEND_FLOOR"
          frontend_floor="$BOOTSTRAP_FRONTEND_FLOOR"
          floor_source="bootstrap constant"

          # `status=success` is the conclusion, so a run that failed for any reason
          # (including on its own floor step) cannot become the floor. Ask for a
          # handful and skip this run's own id: on a push to master, THIS run is a
          # master run and would otherwise be compared against itself.
          api_path="/repos/${GITHUB_REPOSITORY}/actions/workflows/build-test.yml/runs"
          runs_json=$(gh api "${api_path}?branch=master&status=success&per_page=10" 2>/dev/null || echo '')

          run_id=''
          if [ -n "$runs_json" ]; then
            jq_filter='[.workflow_runs[]? | select((.id | tostring) != $self)] | first | .id // empty'
            run_id=$(printf '%s' "$runs_json" | jq -r --arg self "$GITHUB_RUN_ID" "$jq_filter")
          fi

          if [ -n "$run_id" ]; then
            # download-artifact exits non-zero when the run has no such artifact
            # (an older master run from before this ratchet landed, or an expired
            # one). That is the bootstrap case, not a failure.
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                 --name test-counts --dir /tmp/floor >/dev/null 2>&1 \
               && [ -f /tmp/floor/test-counts.json ]; then
              b=$(jq -r '.backend // empty' /tmp/floor/test-counts.json)
              f=$(jq -r '.frontend // empty' /tmp/floor/test-counts.json)
              # The filter the artifact was MEASURED under. An artifact written
              # before the filter field existed has none, which is treated
              # exactly like a mismatch -- an unlabelled count cannot be shown to
              # cover the same set of tests as this run, and assuming it does is
              # the silent apples-to-oranges comparison this field exists to
              # prevent.
              artifact_filter=$(jq -r '.filter // empty' /tmp/floor/test-counts.json)

              # Both counts must be present and numeric, or neither is used: a
              # half-read artifact would silently drop one suite's floor to the
              # bootstrap constant while looking like it had ratcheted.
              if ! printf '%s' "$b" | grep -qE '^[0-9]+$' || ! printf '%s' "$f" | grep -qE '^[0-9]+$'; then
                echo "test-counts artifact from run ${run_id} is unreadable; falling back to bootstrap constants." >&2
              elif [ "$artifact_filter" != "$TEST_FILTER" ]; then
                # Loud on purpose: ::notice:: surfaces in the run summary rather
                # than only in the log body. A floor carried across a filter
                # change would compare this run's count against a count of a
                # different set of tests, which either blocks a correct PR or
                # hides a real shrink.
                echo "::notice title=Test-count floor fell back to bootstrap constants::The test-counts artifact from master run ${run_id} was measured under filter '${artifact_filter:-(none recorded)}', but this run uses filter '${TEST_FILTER}'. The two counts are not comparable, so the bootstrap constants (backend ${BOOTSTRAP_BACKEND_FLOOR}, frontend ${BOOTSTRAP_FRONTEND_FLOOR}) are used instead. Once master has run under the new filter, update the bootstrap constants from a number a master run actually printed (run this workflow via workflow_dispatch with measure-filter=true)."
              else
                backend_floor="$b"
                frontend_floor="$f"
                floor_source="master run ${run_id}"
              fi
            fi
          fi

          echo "BACKEND_FLOOR=$backend_floor" >> "$GITHUB_ENV"
          echo "FRONTEND_FLOOR=$frontend_floor" >> "$GITHUB_ENV"
          echo "FLOOR_SOURCE=$floor_source" >> "$GITHUB_ENV"
          echo "Test-count floor source: $floor_source (backend: $backend_floor, frontend: $frontend_floor)"

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: trx-*
          # Deliberately NOT merge-multiple. Flattening the three artifacts into
          # one directory makes two identically-named trx overwrite each other,
          # and the loss shows up as a short executed= sum -- i.e. as a floor
          # breach in the wrong place. Each artifact keeps its own subdirectory
          # (./TestResults/trx-A1/, trx-A2/, trx-B/, trx-C/) so a collision is
          # impossible
          # even before the per-assembly LogFileName above makes names unique.
          path: ./TestResults

      - name: Enforce test-count floor
        shell: bash
        run: |
          set -euo pipefail
          # The gate logic (arb-6ke/arb-adm/arb-u9i) lives in a sourced script so the
          # positive controls in .github/scripts/test-count-gate-controls.sh run the
          # SAME text CI runs -- see docs/standards/process.md. The checks are
          # ordered, not independent: the set check must pass before the shard
          # records are read, and the ratchet is last because it is the weakest of
          # the three and must not be what reports a fault the others can name.
          #
          # That order now lives in run_test_count_gate, inside the script, so a
          # control EXECUTES it instead of reading this YAML (arb-1da). Call the
          # entry function only -- do not re-add the three bare calls beside it;
          # a control asserts they are gone.
          . ./.github/scripts/test-count-gate.sh

          run_test_count_gate

      # Two counts and two parsers, deliberately, so neither suite's count can
      # mask a collapse in the other: the backend floor above parses executed="N"
      # out of the .trx, this one reads the frontend job's output, which that job
      # parsed from numPassedTests in the Vitest JSON report. Both are ratcheted
      # against the SAME master run resolved above, so the pair moves together
      # and one suite cannot be ratcheted from a run that never measured the other.
      - name: Enforce frontend test-count floor
        shell: bash
        run: |
          set -euo pipefail

          floor="$FRONTEND_FLOOR"
          total="$FRONTEND_COUNT"

          # The frontend job succeeded (the aggregate check above proved it), so
          # an empty or non-numeric count here means the output did not survive
          # the job boundary rather than that the suite was empty. Failing loudly
          # beats comparing an empty string against the floor, which `-lt` would
          # read as 0 and block on -- or, worse, a future refactor could read as
          # a pass.
          if ! printf '%s' "$total" | grep -qE '^[0-9]+$'; then
            echo "BLOCKED: frontend job output 'count' was not a number ('${total}')." >&2
            exit 1
          fi

          echo "Frontend passed test count: $total (floor: $floor)"
          echo "Frontend floor source: $FLOOR_SOURCE"
          if [ "$total" -lt "$floor" ]; then
            echo "BLOCKED: frontend passed test count ($total) is below master's last measured count ($floor, from $FLOOR_SOURCE)." >&2
            exit 1
          fi

      # A measure-filter run exists to PRINT a number for the bootstrap
      # constants, so it must not also write the artifact: publishing a count
      # from a hand-triggered run would let the ratchet's floor be set by
      # whoever pressed the button, on whatever ref they chose, which is exactly
      # the hand-written floor the ratchet replaced.
      - name: Report measured counts (measure-filter run)
        if: inputs.measure-filter
        shell: bash
        run: |
          set -euo pipefail
          echo "Measured under filter: $TEST_FILTER"
          echo "Backend executed test count:      $BACKEND_COUNT"
          echo "Frontend passed test count:       $FRONTEND_COUNT"
          echo "No test-counts artifact was written by this run."
          {
            echo "### Measured test counts"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Filter | \`$TEST_FILTER\` |"
            echo "| Backend (executed) | $BACKEND_COUNT |"
            echo "| Frontend (passed) | $FRONTEND_COUNT |"
            echo ""
            echo "Set \`BOOTSTRAP_BACKEND_FLOOR\` / \`BOOTSTRAP_FRONTEND_FLOOR\` from these numbers"
            echo "only when this run was on \`master\`. Never by arithmetic on the previous value."
          } >> "$GITHUB_STEP_SUMMARY"

      # The next run's floor. Written only when every gate above passed, because
      # this artifact is only ever read from a run whose conclusion was success --
      # publishing a count from a run that failed would let a broken run set the
      # bar. Uploaded on every branch: a PR's artifact is simply never selected,
      # since the lookup filters on branch=master.
      #
      # The recorded `filter` is what a later run compares against its own before
      # trusting these counts; it is written from the same TEST_FILTER variable
      # the test step used, so it cannot describe a run that measured something
      # else.
      - name: Record test counts
        if: ${{ !inputs.measure-filter }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --argjson backend "$BACKEND_COUNT" \
            --argjson frontend "$FRONTEND_COUNT" \
            --arg filter "$TEST_FILTER" \
            '{backend: $backend, frontend: $frontend, filter: $filter}' > test-counts.json
          cat test-counts.json

      - name: Upload test counts
        if: ${{ !inputs.measure-filter }}
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: test-counts
          path: test-counts.json
          if-no-files-found: error
