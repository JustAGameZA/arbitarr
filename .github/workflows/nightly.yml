# Nightly: the UNFILTERED suite, plus a flake hunt, plus a summary of both.
#
# WHY THIS WORKFLOW EXISTS. The PR and master lanes run one shared category
# filter, `Category!=Timing&Category!=Load&Category!=Quarantine` (build-test.yml's
# TEST_FILTER). Everything that filter carves out still has to RUN somewhere, or
# excluding it from the merge path would quietly become deleting it. This is that
# somewhere: no --filter anywhere below, so Timing, Load and Quarantine all run.
# See docs/adr/0011-test-strategy-lanes-isolation-quarantine.md.
#
# ----------------------------------------------------------------------------
# THIS WORKFLOW MUST NEVER WRITE THE `test-counts` ARTIFACT.
# ----------------------------------------------------------------------------
# build-test.yml's floor step resolves the ratchet's floor by downloading the
# artifact NAMED `test-counts` from the latest successful run on master. It
# selects by artifact NAME, so an artifact of that name written from here would
# be picked up as though a PR-lane run had produced it. The number would be an
# UNFILTERED count -- larger than any filtered run can ever measure, because it
# includes the very tests the merge path excludes -- and every subsequent PR
# would then be blocked for failing to reach a floor no filtered run can reach.
# The `filter` field added in arb-rga.5 narrows the blast radius (a mismatched
# filter falls back to the bootstrap constants with a loud notice) but is NOT a
# licence to write the artifact from here: the fallback is a safety net for a
# filter CHANGE, not a sanctioned second producer.
#
# The artifacts below are therefore named `nightly-*`, and no step in this file
# writes a file called test-counts.json. Do not add one.
# ----------------------------------------------------------------------------

name: Nightly

permissions:
  contents: read

on:
  # 03:00 UTC daily. Off-peak on two counts: it is the middle of the night for
  # the maintainer, so no PR's required checks are queued behind this ~15-minute
  # run, and it dodges the `0 0 * * *` midnight slot where GitHub's hosted-runner
  # queue is most contended. Daily rather than weekly because the flake hunt's
  # value is proportional to how soon it runs after the merge that introduced a
  # flake -- a week's worth of merges to bisect is most of the value gone.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Deliberately no `pull_request:` and no `push:` trigger. This workflow is not a
# merge gate and must not become one: it runs the tests the merge path excludes,
# so a failure here is a signal to investigate, not a reason to block a PR that
# never ran them. It is not in branch protection's required checks either.

env:
  # Kept identical to build-test.yml's job-level value (see that file's env
  # block). A test-hosting class here can hold a live ASP.NET host at ~1.06 GB
  # RSS, and Integration runs four at a time (xunit.runner.json, arb-rga.4); the
  # two settings are only safe as a PAIR, so a nightly that raised this limit
  # would be exercising a memory profile no PR ever runs.
  DOTNET_GCHeapHardLimit: "0x80000000"

jobs:
  # ==========================================================================
  # Job 1: the whole solution plus the frontend, with NO category filter.
  # ==========================================================================
  full-suite:
    name: Full suite (unfiltered)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Arbitarr.sln

      # -m:1 on the BUILD only, mirroring build-test.yml. It constrains MSBuild's
      # project-level parallelism, not the test runner's, so it does not affect
      # what this workflow measures.
      - name: Build
        run: dotnet build Arbitarr.sln -c Release -m:1 --no-restore

      # NO --filter. That absence is the entire point of this job; a filter added
      # here would make the nightly a slower copy of the PR lane and leave
      # Timing/Load/Quarantine running nowhere at all.
      - name: Test (unfiltered)
        id: backend-tests
        continue-on-error: true
        run: >-
          dotnet test Arbitarr.sln -c Release --no-build
          --logger "trx;LogFileName=full-suite.trx"
          --results-directory ./TestResults

      # How many tests CARRY the excluded traits. --list-tests discovers without
      # executing, so this is cheap and, unlike an executed count, it still
      # reports a number when one of those tests fails. It is a count of tests
      # carrying the trait, NOT a count of tests that ran -- the summary labels
      # it that way, because reading it as "executed" would understate the suite.
      - name: Count Timing/Load tests (discovery only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ./TestResults
          for category in Timing Load; do
            # --list-tests prints one indented line per discovered test after a
            # header; count the indented lines rather than parsing the header.
            n=$(dotnet test Arbitarr.sln -c Release --no-build \
                  --filter "Category=$category" --list-tests 2>/dev/null \
                | grep -cE '^\s{4,}\S' || true)
            printf '%s\t%s\n' "$category" "${n:-0}" >> ./TestResults/category-counts.tsv
          done
          cat ./TestResults/category-counts.tsv

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Arbitarr.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/Arbitarr.Web
        # `npm ci`, not `npm install`, for the same reason as the PR lane: the
        # committed lockfile is authoritative and drift should fail, not resolve.
        run: npm ci

      # The `test` script already emits vitest-report.json (--reporter=json
      # --outputFile=), so the report the summary reads needs no extra flags.
      - name: Frontend tests
        id: frontend-tests
        continue-on-error: true
        working-directory: src/Arbitarr.Web
        run: npm test

      - name: Upload full-suite results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: nightly-full-suite
          path: |
            TestResults/*.trx
            TestResults/category-counts.tsv
            src/Arbitarr.Web/vitest-report.json
          if-no-files-found: warn

      # continue-on-error above lets job 2 and the summary run to completion even
      # when tests fail -- an incomplete summary is exactly what this workflow
      # exists to avoid. But continue-on-error also marks the STEP successful, so
      # without this gate the JOB would report green over a red suite. Re-reading
      # the recorded outcomes here is what keeps the job's status honest.
      - name: Reflect test failures in job status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          backend="${{ steps.backend-tests.outcome }}"
          frontend="${{ steps.frontend-tests.outcome }}"
          echo "Backend test step:  $backend"
          echo "Frontend test step: $frontend"
          if [ "$backend" != "success" ] || [ "$frontend" != "success" ]; then
            echo "::error title=Nightly full suite failed::backend=$backend frontend=$frontend. See the Summary job for the per-test breakdown."
            exit 1
          fi

  # ==========================================================================
  # Job 2: rerun the two assemblies most exposed to cross-test interference,
  # five times each, to surface tests that only fail sometimes.
  # ==========================================================================
  flake-hunt:
    name: Flake hunt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Arbitarr.sln

      # THIS JOB BUILDS ITS OWN COPY rather than downloading job 1's output.
      # Passing a Release build tree between jobs means uploading hundreds of MB
      # of DLLs and PDBs, which costs more wall-clock than the rebuild it saves;
      # and it would make this job depend on job 1, so a build failure there --
      # or a flaky artifact upload -- would take the flake hunt with it, which is
      # precisely the coupling the "job 2 still runs" requirement rules out.
      # An independent build also keeps a flake in job 1's plumbing from reading
      # as a flake in the suite, which is the only thing this job measures.
      # If arb-rga.6 later introduces a shared solution build artifact for the PR
      # lane, this job can adopt it then and drop the rebuild.
      - name: Build
        run: dotnet build Arbitarr.sln -c Release -m:1 --no-restore

      # Unfiltered, like job 1. Each iteration writes its OWN trx, named
      # <assembly>-iter<N>.trx: the summary parser derives both the assembly and
      # the iteration number from that filename, which is what lets it report
      # "failed in iterations 2 and 4" rather than just "failed somewhere".
      - name: Rerun Integration and Data five times each
        id: hunt
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p ./TestResults
          failed_iterations=""

          for project in Integration Data; do
            for i in 1 2 3 4 5; do
              echo "::group::Arbitarr.${project}.Tests iteration ${i}"
              # A failing iteration must NOT stop the loop: an intermittent test
              # is only visible across iterations, so the run that fails is data,
              # not a reason to abandon the remaining runs.
              if dotnet test "tests/Arbitarr.${project}.Tests" -c Release --no-build \
                   --logger "trx;LogFileName=${project}-iter${i}.trx" \
                   --results-directory ./TestResults; then
                echo "iteration ${i}: passed"
              else
                echo "iteration ${i}: FAILED"
                failed_iterations="${failed_iterations} ${project}#${i}"
              fi
              echo "::endgroup::"
            done
          done

          if [ -n "$failed_iterations" ]; then
            echo "Failing iterations:${failed_iterations}"
            echo "failed_iterations=${failed_iterations}" >> "$GITHUB_OUTPUT"
          else
            echo "All 10 iterations passed."
          fi

      - name: Upload flake-hunt results
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: nightly-flake-hunt
          path: TestResults/*.trx
          if-no-files-found: warn

      # Same reasoning as job 1's gate: the loop above deliberately swallows each
      # iteration's exit code so every iteration runs, so the job's status has to
      # be re-derived from what was recorded.
      - name: Reflect flake-hunt failures in job status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failed="${{ steps.hunt.outputs.failed_iterations }}"
          if [ -n "$failed" ]; then
            echo "::error title=Flake hunt found failing iterations::${failed}. See the Summary job for which tests, and in which iterations."
            exit 1
          fi
          echo "No iteration failed."

  # ==========================================================================
  # Job 3: parse every trx from both jobs into one human-readable summary.
  # ==========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [full-suite, flake-hunt]
    # always(): the summary is most valuable exactly when a job above went red.
    # `needs` alone would skip this job on their failure and throw away the only
    # per-test breakdown the run produces.
    if: always()
    steps:
      - name: Download full-suite results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          name: nightly-full-suite
          path: ./results/full-suite

      - name: Download flake-hunt results
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        continue-on-error: true
        with:
          name: nightly-flake-hunt
          path: ./results/flake-hunt

      - name: Build summary
        shell: bash
        run: |
          set -euo pipefail

          out="nightly-summary.md"

          {
            echo "## Nightly suite - $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Run: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) on \`${GITHUB_REF_NAME}\`."
            echo ""
            echo "This suite runs **unfiltered**: Timing, Load and Quarantine tests all execute here,"
            echo "unlike the PR and master lanes. A failure below is therefore not necessarily a"
            echo "regression in the merge path."
            echo ""
            echo "> **Filing beads stays MANUAL.** Beads run in stealth mode in this repo and are"
            echo "> local-only, so nothing here can open an issue for a newly discovered flake."
            echo "> If a test appears in the table below and has no bead yet, file one by hand and"
            echo "> tag the test \`Category=Quarantine\` + \`Bead=arb-xxx\` (ADR 0011)."
            echo ""
            echo "> This workflow never writes the \`test-counts\` artifact: these counts are"
            echo "> unfiltered and must never reach the PR lane's ratchet."
            echo ""
          } > "$out"

          # ------------------------------------------------------------------
          # Parse every trx.
          #
          # Records are split on '<' so each element begins a line. This matters:
          # a PASSING UnitTestResult is self-closing ('/>'), while a FAILING one
          # is an open tag wrapping <Output><ErrorInfo> children. A pattern
          # anchored on '/>' therefore matches only passes and reports every run
          # as clean -- the exact silent-green failure this summary exists to
          # prevent. Attributes are read one at a time, so their order within the
          # element does not matter either.
          # ------------------------------------------------------------------
          failures_tsv=$(mktemp)
          totals_tsv=$(mktemp)

          # Found by `find`, not by a fixed-depth glob. upload-artifact v4 roots
          # an artifact at the LEAST COMMON ANCESTOR of the files it matched, so
          # the two artifacts land at DIFFERENT depths: the full-suite artifact
          # also carries src/Arbitarr.Web/vitest-report.json, which pushes its LCA
          # up to the repo root and preserves `TestResults/` in the path, while
          # the flake-hunt artifact matches only TestResults/*.trx and is
          # therefore flattened. A `./results/*/*.trx` glob matches the flattened
          # one and MISSES the nested one -- reporting the flake hunt while
          # silently dropping the entire unfiltered run, which reads as a smaller
          # green summary rather than as an error.
          shopt -s nullglob
          while IFS= read -r -u 3 trx; do
            base=$(basename "$trx" .trx)
            # The job is the FIRST path segment under ./results, whatever the
            # depth below it.
            job_dir=$(printf '%s' "${trx#./results/}" | cut -d/ -f1)

            if printf '%s' "$base" | grep -qE -- '-iter[0-9]+$'; then
              assembly=$(printf '%s' "$base" | sed -E 's/-iter[0-9]+$//')
              iteration=$(printf '%s' "$base" | sed -E 's/^.*-iter([0-9]+)$/\1/')
            else
              assembly="$base"
              iteration="-"
            fi

            while IFS= read -r rec; do
              outcome=$(printf '%s' "$rec" | sed -n 's/.* outcome="\([^"]*\)".*/\1/p')
              [ "$outcome" = "Failed" ] || continue
              name=$(printf '%s' "$rec" | sed -n 's/.* testName="\([^"]*\)".*/\1/p')
              # A [Theory]'s inline data arrives XML-escaped; un-escape it so the
              # table shows a name a developer can actually search the tree for.
              name=$(printf '%s' "$name" | sed -e 's/&quot;/"/g' -e "s/&apos;/'/g" \
                                               -e 's/&lt;/</g' -e 's/&gt;/>/g' -e 's/&amp;/\&/g')
              printf '%s\t%s\t%s\t%s\n' "$job_dir" "$assembly" "$name" "$iteration" >> "$failures_tsv"
            done < <(tr '<' '\n' < "$trx" | grep '^UnitTestResult ')

            # "executed", not "total" -- the same attribute and the same parse as
            # build-test.yml's floor step, so the two never disagree about what a
            # count means. (This count is reported only; it is never published as
            # a floor. See the header of this file.)
            counters=$(grep -o '<Counters[^>]*>' "$trx" | head -1)
            ex=$(printf '%s' "$counters" | grep -o 'executed="[0-9]*"' | head -1 | grep -o '[0-9]*' || true)
            pa=$(printf '%s' "$counters" | grep -o 'passed="[0-9]*"'   | head -1 | grep -o '[0-9]*' || true)
            fa=$(printf '%s' "$counters" | grep -o 'failed="[0-9]*"'   | head -1 | grep -o '[0-9]*' || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$job_dir" "$assembly" "${ex:-0}" "${pa:-0}" "${fa:-0}" >> "$totals_tsv"
          # Fed on FD 3 (read -u 3), not on stdin: the inner `while ... done < <(tr
          # ...)` above already redirects stdin, and driving both loops from stdin
          # would let the inner one consume the outer one's file list -- processing
          # the first trx and silently ignoring every other one.
          done 3< <(find ./results -type f -name '*.trx' | sort)
          shopt -u nullglob

          {
            echo "### Tests that failed in any iteration"
            echo ""
            if [ ! -s "$failures_tsv" ]; then
              if [ ! -s "$totals_tsv" ]; then
                echo "**No .trx files were found.** Both upstream jobs failed before producing"
                echo "results, or the artifacts did not upload - this is NOT an all-clear."
              else
                echo "No test failed, in any assembly, in any iteration."
              fi
            else
              echo "| Job | Assembly | Test | Failed in iteration(s) |"
              echo "|---|---|---|---|"
              # -k4,4n so iterations sort NUMERICALLY: a lexical sort renders
              # "3, 5, 10" as "10, 3, 5", which misreads once the hunt passes 9.
              sort -t$'\t' -k1,1 -k2,2 -k3,3 -k4,4n "$failures_tsv" | awk -F'\t' '
                { key = $1 "\t" $2 "\t" $3
                  if (key != prev && NR > 1) { printf "| %s | %s | `%s` | %s |\n", pj, pa, pt, iters; iters = "" }
                  if (key != prev) { pj = $1; pa = $2; pt = $3; iters = "" }
                  iters = (iters == "" ? $4 : iters ", " $4)
                  prev = key }
                END { if (NR > 0) printf "| %s | %s | `%s` | %s |\n", pj, pa, pt, iters }'
            fi

            echo ""
            echo "### Totals"
            echo ""
            if [ ! -s "$totals_tsv" ]; then
              echo "No results to total."
            else
              echo "| Job | Assembly | Executed | Passed | Failed |"
              echo "|---|---|---|---|---|"
              sort -t$'\t' -k1,1 -k2,2 "$totals_tsv" | awk -F'\t' '
                { k = $1 "\t" $2; ex[k] += $3; pa[k] += $4; fa[k] += $5; if (!(k in seen)) { seen[k]; order[++n] = k } }
                END { for (i = 1; i <= n; i++) { split(order[i], p, "\t"); printf "| %s | %s | %d | %d | %d |\n", p[1], p[2], ex[order[i]], pa[order[i]], fa[order[i]] } }'
              echo ""
              awk -F'\t' '{ e += $3; p += $4; f += $5 }
                END { printf "**Overall:** %d executed, %d passed, %d failed.\n", e, p, f }' "$totals_tsv"
            fi

            echo ""
            echo "### Frontend"
            echo ""
            report="./results/full-suite/src/Arbitarr.Web/vitest-report.json"
            if [ -f "$report" ]; then
              # node is not guaranteed on this job (no setup-node step), so read
              # the two numbers with grep rather than requiring a runtime.
              fe_passed=$(grep -o '"numPassedTests":[0-9]*' "$report" | head -1 | grep -o '[0-9]*' || true)
              fe_failed=$(grep -o '"numFailedTests":[0-9]*' "$report" | head -1 | grep -o '[0-9]*' || true)
              echo "| | |"
              echo "|---|---|"
              echo "| Passed | ${fe_passed:-unknown} |"
              echo "| Failed | ${fe_failed:-unknown} |"
            else
              echo "No \`vitest-report.json\` was found in the full-suite artifact."
            fi

            echo ""
            echo "### Excluded-category coverage"
            echo ""
            counts="./results/full-suite/TestResults/category-counts.tsv"
            if [ -f "$counts" ]; then
              echo "Tests carrying each trait the PR lane filters out. These are **discovery**"
              echo "counts (\`--list-tests\`) - tests carrying the trait, *not* tests executed."
              echo "All of them ran in this workflow; any that failed appear in the table above."
              echo ""
              echo "| Category | Tests carrying the trait (discovered) |"
              echo "|---|---|"
              while IFS=$'\t' read -r category n; do
                [ -n "$category" ] || continue
                echo "| $category | $n |"
              done < "$counts"
            else
              echo "No category counts were recorded (the discovery step did not run or failed)."
            fi

            echo ""
            echo "### Upstream job results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Full suite (unfiltered) | ${{ needs.full-suite.result }} |"
            echo "| Flake hunt | ${{ needs.flake-hunt.result }} |"
          } >> "$out"

          rm -f "$failures_tsv" "$totals_tsv"

          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          cat "$out"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: nightly-summary
          path: nightly-summary.md
          if-no-files-found: warn
