name: Deploy review environment

# Name-vs-meaning warning (keep the name, correct the reading). The required-check name
# `Deploy review environment` is fixed by the branch protection rule and is not renamed here.
# But a green tick on it means exactly two things: the image builds, and the built container
# answers /health. It does not mean anything was deployed anywhere - no review environment
# exists, and the Unraid target is never reached from CI. At M0 this smoke check is
# near-vacuous, because the Host exposes only /health: the check can pass while the product
# does nothing. Its meaning grows as milestones land - after M1 it proves the endpoint surface
# starts, after M2 the dashboard is served, after M7 the first-run path works. The only
# deployment evidence in this plan is the manual Unraid round-trip recorded at M1, M2, and M7.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  deploy-review:
    name: Deploy review environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Computed in its own step rather than inline: the `build-args` block below is
      # YAML, not shell, so a `$(date ...)` written there would be passed through
      # literally and the image would carry the command text as its build timestamp.
      - name: Compute build timestamp
        id: stamp
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # buildx replaces the plain `docker build` solely to get a layer cache across
      # runs (`type=gha`). The image content is unchanged: same Dockerfile, same
      # three build args, same tag.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container image
        # Issue #46/R1: pass the commit SHA and a tag through as build args so the image
        # itself carries what CI actually built. Without this, GET /api/system/build on a
        # CI-built image would render "unknown (local build)" for every build-time field --
        # correct as a fallback, but wrong for a real CI-built image, and exactly the gap
        # a deployment-drift check needs not to have.
        #
        # `push: false` with `load: true` is not the default pair, and both halves matter:
        # buildx builds into its own cache and would otherwise leave the local Docker
        # daemon without the image, but every step after this one (the AC21 dataset scan,
        # `docker run`, the compose stack) addresses `arbitarr-review:ci` through that
        # daemon. `load` is what puts it there. Nothing is pushed anywhere -- this
        # workflow has no registry credentials and needs none.
        #
        # The gha cache backend needs no extra permission: it authenticates with the
        # Actions runtime token the runner already holds, not with GITHUB_TOKEN, so the
        # workflow-level `permissions: contents: read` above is left exactly as it was.
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: arbitarr-review:ci
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            IMAGE_TAG=arbitarr-review:ci
            BUILD_TIMESTAMP_UTC=${{ steps.stamp.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert no dataset is baked into the image (AC21)
        shell: bash
        run: |
          set -euo pipefail

          # AC21/M7-4: datasets (e.g. AniDB's anime-lists mapping) must only ever be fetched at
          # runtime into the mounted /config volume (see DatasetProvisioner), never vendored into
          # the image itself. NoNetworkFirstRunTests covers the runtime half (no network access
          # needed to boot and serve); this covers the image-content half - no baked dataset file
          # and no pre-populated config/data directory anywhere in the published image.
          found=$(docker run --rm --entrypoint sh arbitarr-review:ci -c \
            "find / -xdev \( -iname '*anime*list*' -o -iname 'anime-offline-database*' \) 2>/dev/null; \
             find /config -mindepth 1 2>/dev/null; \
             true")

          if [ -n "$found" ]; then
            echo "BLOCKED: found baked dataset/pre-populated config content in the image:" >&2
            echo "$found" >&2
            exit 1
          fi

          echo "No baked dataset or pre-populated config directory found."

      - name: Run container
        run: docker run -d --name arbitarr-review -p 127.0.0.1:8080:8080 arbitarr-review:ci

      - name: Smoke-check /health
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/health" -o /tmp/health.json; then
              echo "Container answered /health after ${i} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "BLOCKED: container did not answer /health within the timeout." >&2
          docker logs arbitarr-review >&2 || true
          exit 1

      - name: Assert the build stamp matches the commit CI built (issue #46 AC6)
        shell: bash
        run: |
          set -euo pipefail

          build_json=$(curl -sf "http://127.0.0.1:8080/api/system/build")
          echo "$build_json"

          reported_sha=$(echo "$build_json" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4)

          if [ "$reported_sha" != "${{ github.sha }}" ]; then
            echo "BLOCKED: /api/system/build reported commitSha '$reported_sha', expected '${{ github.sha }}'." >&2
            exit 1
          fi

          echo "Build stamp matches the commit CI built: $reported_sha"

      - name: Container logs
        if: failure()
        run: docker logs arbitarr-review || true

      # arb-rga.7: the E2E golden path runs AFTER the assertions above, against the same
      # image they just vetted. The standalone container is stopped first because compose
      # republishes 127.0.0.1:8080 and the two would collide on that port.
      #
      # Loopback is not incidental: ADR 0004's bootstrap bypass admits admin-mutating
      # routes only from loopback/RFC 1918 while no admin key is set, decided from the
      # socket's peer address, and the E2E bootstraps its key through exactly that window.
      - name: Stop the standalone container before the E2E stack
        # `if: always()` so a failing step above still removes the container. The step this
        # one replaced carried it for that reason: on a self-hosted runner a surviving
        # arbitarr-review makes the NEXT run's `docker run --name arbitarr-review` collide,
        # turning one failure into every later run failing. Keep it.
        if: always()
        run: docker rm -f arbitarr-review || true

      - name: Start the E2E stack (app under test plus stub upstream)
        working-directory: tests/e2e
        # --wait gates on the stub's healthcheck only. The app container declares none: its
        # runtime image (mcr.microsoft.com/dotnet/aspnet) ships neither wget nor curl, and
        # adding one purely to satisfy a probe would alter the very image under test.
        run: docker compose -f compose.yml up -d --wait

      - name: Wait for the app to answer /health
        shell: bash
        working-directory: tests/e2e
        # Readiness is probed from the runner, which has curl, precisely because the image
        # under test cannot probe itself. Same shape as the standalone smoke-check above.
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8080/health" -o /dev/null; then
              echo "E2E stack answered /health after ${i} attempt(s)."
              exit 0
            fi
            sleep 1
          done

          echo "BLOCKED: the E2E stack did not answer /health within the timeout." >&2
          docker compose -f compose.yml logs --no-color >&2 || true
          exit 1

      - name: Set up Node for Playwright
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        # Chromium only, matching playwright.config.ts's single project: pulling every
        # browser would cost minutes for engines this lane does not exercise.
        run: npx playwright install --with-deps chromium

      - name: Run the E2E golden path
        working-directory: tests/e2e
        run: npm test

      - name: E2E stack logs
        if: failure()
        working-directory: tests/e2e
        run: docker compose -f compose.yml logs --no-color || true

      - name: Upload the Playwright trace
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: playwright-trace
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the E2E stack
        if: always()
        working-directory: tests/e2e
        run: docker compose -f compose.yml down -v || true
