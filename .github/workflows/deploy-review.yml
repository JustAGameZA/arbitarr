name: Deploy review environment

# Name-vs-meaning warning (keep the name, correct the reading). The required-check name
# `Deploy review environment` is fixed by the branch protection rule and is not renamed here.
# But a green tick on it means exactly two things: the image builds, and the built container
# answers /health. It does not mean anything was deployed anywhere - no review environment
# exists, and the Unraid target is never reached from CI. At M0 this smoke check is
# near-vacuous, because the Host exposes only /health: the check can pass while the product
# does nothing. Its meaning grows as milestones land - after M1 it proves the endpoint surface
# starts, after M2 the dashboard is served, after M7 the first-run path works. The only
# deployment evidence in this plan is the manual Unraid round-trip recorded at M1, M2, and M7.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [master]

jobs:
  deploy-review:
    name: Deploy review environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build container image
        # Issue #46/R1: pass the commit SHA and a tag through as build args so the image
        # itself carries what CI actually built. Without this, GET /api/system/build on a
        # CI-built image would render "unknown (local build)" for every build-time field --
        # correct as a fallback, but wrong for a real CI-built image, and exactly the gap
        # a deployment-drift check needs not to have.
        run: |
          docker build -f Dockerfile -t arbitarr-review:ci \
            --build-arg COMMIT_SHA="${{ github.sha }}" \
            --build-arg IMAGE_TAG="arbitarr-review:ci" \
            --build-arg BUILD_TIMESTAMP_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Assert no dataset is baked into the image (AC21)
        shell: bash
        run: |
          set -euo pipefail

          # AC21/M7-4: datasets (e.g. AniDB's anime-lists mapping) must only ever be fetched at
          # runtime into the mounted /config volume (see DatasetProvisioner), never vendored into
          # the image itself. NoNetworkFirstRunTests covers the runtime half (no network access
          # needed to boot and serve); this covers the image-content half - no baked dataset file
          # and no pre-populated config/data directory anywhere in the published image.
          found=$(docker run --rm --entrypoint sh arbitarr-review:ci -c \
            "find / -xdev \( -iname '*anime*list*' -o -iname 'anime-offline-database*' \) 2>/dev/null; \
             find /config -mindepth 1 2>/dev/null; \
             true")

          if [ -n "$found" ]; then
            echo "BLOCKED: found baked dataset/pre-populated config content in the image:" >&2
            echo "$found" >&2
            exit 1
          fi

          echo "No baked dataset or pre-populated config directory found."

      - name: Run container
        run: docker run -d --name arbitarr-review -p 127.0.0.1:8080:8080 arbitarr-review:ci

      - name: Smoke-check /health
        shell: bash
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/health" -o /tmp/health.json; then
              echo "Container answered /health after ${i} attempt(s):"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "BLOCKED: container did not answer /health within the timeout." >&2
          docker logs arbitarr-review >&2 || true
          exit 1

      - name: Assert the build stamp matches the commit CI built (issue #46 AC6)
        shell: bash
        run: |
          set -euo pipefail

          build_json=$(curl -sf "http://127.0.0.1:8080/api/system/build")
          echo "$build_json"

          reported_sha=$(echo "$build_json" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4)

          if [ "$reported_sha" != "${{ github.sha }}" ]; then
            echo "BLOCKED: /api/system/build reported commitSha '$reported_sha', expected '${{ github.sha }}'." >&2
            exit 1
          fi

          echo "Build stamp matches the commit CI built: $reported_sha"

      - name: Container logs
        if: failure()
        run: docker logs arbitarr-review || true

      - name: Stop container
        if: always()
        run: docker rm -f arbitarr-review || true
