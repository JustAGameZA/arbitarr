name: Publish image

# Publishes the runtime image to GHCR on every push to master, so the deployed host can
# pull a built image instead of building from source on the box.
#
# Scope-vs-sibling-workflows note. Three workflows now run `docker build` on master and they
# are NOT redundant:
#   * `Build & test`          - restore/build/test. Never builds an image.
#   * `Deploy review environment` - builds an image and asserts things ABOUT it (health, build
#     stamp, no baked dataset). It is a required check and gates the merge. It publishes nothing.
#   * this one                - publishes. It runs only AFTER master already has the commit,
#     so it never gates a PR and never blocks a merge.
# The duplicated build cost is deliberate: making the required check depend on a publish step
# would mean a registry outage could block merges, and making the publish reuse the review
# image would mean publishing an artifact no required check had inspected on master.
#
# This workflow does NOT deploy. Watchtower on the host polls GHCR and pulls (see the
# `com.centurylinklabs.watchtower.enable` label on the arbitarr container). Nothing here
# reaches the host, and no host credential exists in this repo.

permissions:
  contents: read

on:
  push:
    branches: [master]

concurrency:
  # Serialise publishes so two quick master merges cannot race to move the `master` tag, which
  # would leave it pointing at the older of the two. Not `cancel-in-progress`: an already-running
  # publish for an earlier commit should finish and be superseded, not be aborted half-pushed.
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the workflow's own GITHUB_TOKEN. No PAT is involved:
      # the token is scoped to this repo and expires with the job, so there is no long-lived
      # registry credential to rotate or leak.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Lowercase the owner: GHCR rejects uppercase repository names, and the org is
          # `JustAGameZA`. Deriving it from github.repository_owner rather than hardcoding
          # keeps a fork publishing to its own namespace instead of failing on permissions.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/arbitarr"

          # The short SHA is the immutable identity; `master` is the moving tag Watchtower
          # follows. Both are pushed for every commit, so any deployed digest can always be
          # traced back to an exact commit even after `master` has moved on.
          short_sha="$(git rev-parse --short HEAD)"

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "tags=${image}:master,${image}:${short_sha}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Issue #46/R1: the image must carry what CI actually built, or GET /api/system/build
          # renders "unknown (local build)" and deployment-drift checks lose their only evidence.
          # IMAGE_TAG is pinned to the immutable :<sha> form on purpose - stamping ":master"
          # would make a deployed container report a tag that no longer identifies its own build.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}
            BUILD_TIMESTAMP_UTC=${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image reports the commit it was built from
        shell: bash
        run: |
          set -euo pipefail

          # Pull back BY DIGEST, not by tag. Re-pulling ":master" would re-resolve the tag and
          # could verify a different image than this job just pushed if another publish landed
          # in between; the digest names exactly the artifact built above.
          ref="${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          docker run -d --name verify -p 127.0.0.1:8080:8080 "$ref"

          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/health" -o /tmp/health.json; then
              cat /tmp/health.json; echo
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "BLOCKED: published image did not answer /health." >&2
              docker logs verify >&2 || true
              exit 1
            fi
            sleep 1
          done

          build_json="$(curl -sf "http://127.0.0.1:8080/api/system/build")"
          echo "$build_json"

          reported_sha="$(echo "$build_json" | grep -o '"commitSha":"[^"]*"' | cut -d'"' -f4)"
          if [ "$reported_sha" != "${{ github.sha }}" ]; then
            echo "BLOCKED: published image reports commitSha '$reported_sha', expected '${{ github.sha }}'." >&2
            exit 1
          fi

          echo "Published image reports the commit it was built from: $reported_sha"

      - name: Container logs
        if: failure()
        run: docker logs verify || true

      - name: Stop verification container
        if: always()
        run: docker rm -f verify || true

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.image }}:master"
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}"
            echo "${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
